<text x="260.0" y="373.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">CustomerNotifier</text>
<text x="260.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">OnHandlingReported(object?, HandlingReportedEventArgs)</text>
