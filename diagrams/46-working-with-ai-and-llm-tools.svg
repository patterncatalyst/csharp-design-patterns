<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">A human decision gates every pattern-shaped change</text>
<text x="480" y="530" font-size="12.5" fill="#555555" text-anchor="middle">An assistant proposes code, SHIP0002 flags a single-implementation Strategy, and a human decides whether to collapse it or justify it before the change merges.</text>
