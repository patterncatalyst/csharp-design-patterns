<rect x="360" y="90" width="240" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="480.0" y="123.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">AI assistant proposes</text>
