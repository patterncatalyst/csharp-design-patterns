<path d="M235.0,485 L235.0,500" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M705.0,245 L705.0,260" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M705.0,325 L705.0,340" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M705.0,405 L705.0,420" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
