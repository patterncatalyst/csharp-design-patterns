<text x="241.0" y="104.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">feeds Act&#x27;s inputs</text>
<text x="241.0" y="104.0" font-size="11" fill="#b8650a" text-anchor="middle">feeds Act&#x27;s inputs</text>
