<text x="711.0" y="104.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">reads calls after Act</text>
<text x="711.0" y="104.0" font-size="11" fill="#b8650a" text-anchor="middle">reads calls after Act</text>
