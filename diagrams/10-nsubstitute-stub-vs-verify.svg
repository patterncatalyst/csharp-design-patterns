<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="120" width="450" height="420" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="140" font-size="12" font-weight="700" fill="#888">Stub (Arrange): make the double return values</text>
<rect x="490" y="120" width="450" height="420" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="502" y="140" font-size="12" font-weight="700" fill="#888">Verify (Assert): check the double was called</text>
<rect x="60" y="15" width="840" height="85" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="480.0" y="40.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">One substitute, two jobs</text>
<text x="480.0" y="57.5" font-size="11.5" fill="#555555" text-anchor="middle">Arrange: stub supplies return values, the input the SUT consumes</text>
<text x="480.0" y="72.5" font-size="11.5" fill="#555555" text-anchor="middle">Assert: verify reads recorded calls, the output the SUT produced</text>
<text x="480.0" y="87.5" font-size="11.5" fill="#555555" text-anchor="middle">Arg.Any&lt;T&gt; and Arg.Is&lt;T&gt; apply on both sides</text>
<rect x="40" y="155" width="390" height="65" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="235.0" y="185.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Substitute.For&lt;ITaxPolicy&gt;()</text>
<text x="235.0" y="202.5" font-size="11.5" fill="#555555" text-anchor="middle">creates the double; members start at their type default</text>
<rect x="40" y="235" width="390" height="65" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="235.0" y="265.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">.ApplyTax(100m).Returns(110m)</text>
<text x="235.0" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">stubs the return for that exact call expression</text>
<rect x="40" y="315" width="390" height="65" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="235.0" y="338.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GetBaseRateAsync(...).Returns(money)</text>
<text x="235.0" y="355.0" font-size="11.5" fill="#555555" text-anchor="middle">wraps a plain value in a completed Task&lt;T&gt;</text>
<text x="235.0" y="370.0" font-size="11.5" fill="#555555" text-anchor="middle">Arg.Any&lt;CancellationToken&gt;() stubs the token position</text>
<rect x="40" y="395" width="390" height="65" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="235.0" y="425.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ApplyTax(100m)→110m, ApplyTax(200m)→220m</text>
<text x="235.0" y="442.5" font-size="11.5" fill="#555555" text-anchor="middle">two stubs on one substitute, matched by argument</text>
<rect x="40" y="475" width="390" height="55" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="235.0" y="500.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Unstubbed call</text>
<text x="235.0" y="517.5" font-size="11.5" fill="#555555" text-anchor="middle">returns default(T): 0m, empty, or null</text>
<rect x="510" y="155" width="390" height="65" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="705.0" y="185.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Received(1)</text>
<text x="705.0" y="202.5" font-size="11.5" fill="#555555" text-anchor="middle">asserts the call happened once, with matching arguments</text>
<rect x="510" y="235" width="390" height="65" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="705.0" y="265.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">DidNotReceive()</text>
<text x="705.0" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">asserts a matching call never happened</text>
<rect x="510" y="315" width="390" height="65" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="705.0" y="345.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Arg.Any&lt;T&gt;()</text>
<text x="705.0" y="362.5" font-size="11.5" fill="#555555" text-anchor="middle">matches any value; this position does not matter</text>
<rect x="510" y="395" width="390" height="65" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="705.0" y="425.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Arg.Is&lt;T&gt;(predicate)</text>
<text x="705.0" y="442.5" font-size="11.5" fill="#555555" text-anchor="middle">matches only arguments where the predicate holds</text>
<rect x="510" y="475" width="390" height="55" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="705.0" y="500.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">await carrier.Received(1)...</text>
<text x="705.0" y="517.5" font-size="11.5" fill="#555555" text-anchor="middle">verification is a Task too; missing await checks nothing</text>
