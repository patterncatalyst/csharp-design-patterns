<path d="M235.0,300 L235.0,315" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M235.0,380 L235.0,395" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M235.0,460 L235.0,475" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M705.0,220 L705.0,235" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M705.0,300 L705.0,315" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M705.0,380 L705.0,395" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
