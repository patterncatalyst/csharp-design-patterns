<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">Four classic patterns meet concurrency around one immutable event</text>
<text x="480" y="530" font-size="12.5" fill="#555555" text-anchor="middle">Four classic patterns, observer, iterator, decorator, and command, adapt to concurrency by working from one immutable HandlingEvent that every caller can share safely.</text>
