<text x="549.0" y="232.5" font-size="11.5" fill="#555555" text-anchor="middle">new ShipmentRatingEngine(rates, tax, audit)</text>
<rect x="418" y="330" width="262" height="96" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="549.0" y="376.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">await engine.QuoteAsync(consignment)</text>
<text x="549.0" y="393.0" font-size="11.5" fill="#555555" text-anchor="middle">returns the taxed Money quote</text>
