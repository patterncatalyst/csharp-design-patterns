<text x="196.0" y="412.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Substitute.For&lt;IAuditSink&gt;()</text>
<text x="196.0" y="429.5" font-size="11.5" fill="#555555" text-anchor="middle">RecordAsync(...) returns Task</text>
<text x="196.0" y="444.5" font-size="11.5" fill="#555555" text-anchor="middle">no Returns stub needed</text>
<rect x="418" y="150" width="262" height="120" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
