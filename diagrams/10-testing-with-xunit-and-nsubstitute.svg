<text x="196.0" y="293.5" font-size="11.5" fill="#555555" text-anchor="middle">ApplyTax(Money), synchronous</text>
<text x="196.0" y="308.5" font-size="11.5" fill="#555555" text-anchor="middle">stub 110.00</text>
