<text x="480" y="28" font-size="15" fill="#888" text-anchor="middle" font-weight="700">Four-phase test: Arrange, Act, Assert value, Assert interactions</text>
<text x="480" y="46" font-size="11" fill="#555555" text-anchor="middle">ShipmentRatingEngine under test with three NSubstitute doubles</text>
<text x="480" y="530" font-size="12" fill="#333333" text-anchor="middle">Each substitute supplies a stubbed return value in Arrange and records its own calls for Assert — interactions.</text>
