<text x="892.0" y="213.0" font-size="11.5" fill="#555555" text-anchor="middle">Assert.Equal(new Money(110.00m), quote)</text>
<rect x="744" y="300" width="296" height="212" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="892.0" y="389.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Assert the interactions</text>
<text x="892.0" y="406.0" font-size="11.5" fill="#555555" text-anchor="middle">await rates.Received(1).GetBaseRateAsync(...)</text>
<text x="892.0" y="421.0" font-size="11.5" fill="#555555" text-anchor="middle">tax.Received(1).ApplyTax(new Money(100.00m))</text>
<text x="892.0" y="436.0" font-size="11.5" fill="#555555" text-anchor="middle">await audit.Received(1).RecordAsync(...)</text>
