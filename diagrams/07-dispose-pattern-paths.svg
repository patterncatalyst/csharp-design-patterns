<rect x="20" y="95" width="280" height="410" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="115" font-size="12" font-weight="700" fill="#888">Sealed, managed-only disposables</text>
<rect x="340" y="95" width="280" height="410" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="352" y="115" font-size="12" font-weight="700" fill="#888">Unsealed, or owns an unmanaged handle</text>
<rect x="660" y="95" width="280" height="410" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="672" y="115" font-size="12" font-weight="700" fill="#888">Release requires an await</text>
<rect x="280" y="15" width="400" height="55" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="480.0" y="40.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Pick the dispose shape</text>
<text x="480.0" y="57.5" font-size="11.5" fill="#555555" text-anchor="middle">based on what release actually requires</text>
<rect x="40" y="130" width="240" height="55" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="160.0" y="155.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Dispose()</text>
<text x="160.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">if (_disposed) return;</text>
<rect x="40" y="210" width="240" height="55" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="160.0" y="235.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">_stream.Dispose()</text>
<text x="160.0" y="252.5" font-size="11.5" fill="#555555" text-anchor="middle">_disposed = true</text>
<rect x="40" y="290" width="240" height="55" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="160.0" y="315.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ObjectDisposedException.ThrowIf</text>
<text x="160.0" y="332.5" font-size="11.5" fill="#555555" text-anchor="middle">guards every public member</text>
<rect x="40" y="370" width="240" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="160.0" y="403.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">no finalizer, no Dispose(bool)</text>
<text x="160.0" y="420.0" font-size="11.5" fill="#555555" text-anchor="middle">sealed, one managed field</text>
<rect x="360" y="130" width="240" height="55" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="480.0" y="155.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Dispose()</text>
<text x="480.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">calls Dispose(true)</text>
<rect x="360" y="210" width="240" height="55" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="480.0" y="235.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Dispose(bool disposing)</text>
<text x="480.0" y="252.5" font-size="11.5" fill="#555555" text-anchor="middle">releases managed + unmanaged</text>
<rect x="360" y="290" width="240" height="55" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="480.0" y="315.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GC.SuppressFinalize(this)</text>
<text x="480.0" y="332.5" font-size="11.5" fill="#555555" text-anchor="middle">skips the finalizer run</text>
<rect x="360" y="370" width="240" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="480.0" y="403.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">~Finalizer() calls Dispose(false)</text>
<text x="480.0" y="420.0" font-size="11.5" fill="#555555" text-anchor="middle">backstop if Dispose is never called</text>
<rect x="680" y="130" width="240" height="55" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="800.0" y="155.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">DisposeAsync()</text>
<text x="800.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">if (_disposed) return;</text>
<rect x="680" y="210" width="240" height="55" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="235.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">await _writer.DisposeAsync()</text>
<text x="800.0" y="252.5" font-size="11.5" fill="#555555" text-anchor="middle">.ConfigureAwait(false)</text>
<rect x="680" y="290" width="240" height="55" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="315.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">returns ValueTask</text>
<text x="800.0" y="332.5" font-size="11.5" fill="#555555" text-anchor="middle">avoids a Task allocation</text>
<rect x="680" y="370" width="240" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="800.0" y="403.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">await using releases on scope exit</text>
<text x="800.0" y="420.0" font-size="11.5" fill="#555555" text-anchor="middle">flush completes before close</text>
