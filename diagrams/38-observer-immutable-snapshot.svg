<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">One immutable snapshot keeps a running notification safe from a concurrent change</text>
<text x="480" y="530" font-size="12.5" fill="#555555" text-anchor="middle">HandlingEventHub captures one immutable snapshot of subscribers before Raise iterates it, while a concurrent subscribe or unsubscribe swaps in a new snapshot without disturbing the notification already in flight.</text>
