<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="90" width="920" height="230" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="110" font-size="12" font-weight="700" fill="#888">one test thread drives a thousand bookings before any of them resumes</text>
<rect x="40" y="150" width="150" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="115.0" y="198.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">one calling thread</text>
<text x="115.0" y="215.0" font-size="11.5" fill="#555555" text-anchor="middle">Select(...).ToList()</text>
<rect x="226" y="150" width="150" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="301.0" y="198.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1,000 AcceptAsync calls</text>
<text x="301.0" y="215.0" font-size="11.5" fill="#555555" text-anchor="middle">issued synchronously</text>
<rect x="412" y="150" width="150" height="100" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="487.0" y="198.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1,000 parked awaits</text>
<text x="487.0" y="215.0" font-size="11.5" fill="#555555" text-anchor="middle">zero threads held while parked</text>
<rect x="598" y="150" width="150" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="673.0" y="198.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">gated.Release()</text>
<text x="673.0" y="215.0" font-size="11.5" fill="#555555" text-anchor="middle">a single release call</text>
<rect x="784" y="150" width="150" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="859.0" y="198.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Task.WhenAll</text>
<text x="859.0" y="215.0" font-size="11.5" fill="#555555" text-anchor="middle">drains all 1,000 receipts</text>
<rect x="340" y="380" width="280" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="480.0" y="423.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">1 calling thread, 1,000 parked awaits</text>
<text x="480.0" y="440.0" font-size="11.5" fill="#555555" text-anchor="middle">none of the tasks has completed yet</text>
<path d="M190,200 L226,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="214.0" y="194.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">enumerates</text>
<text x="214.0" y="194.0" font-size="11" fill="#555" text-anchor="middle">enumerates</text>
<path d="M376,200 L412,200" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="400.0" y="194.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">awaits</text>
<text x="400.0" y="194.0" font-size="11" fill="#b8650a" text-anchor="middle">awaits</text>
<path d="M562,200 L598,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="586.0" y="194.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">then releases</text>
<text x="586.0" y="194.0" font-size="11" fill="#555" text-anchor="middle">then releases</text>
<path d="M748,200 L784,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="772.0" y="194.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">resumes</text>
<text x="772.0" y="194.0" font-size="11" fill="#555" text-anchor="middle">resumes</text>
<path d="M487,250 L480,380" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="489.5" y="309.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">asserted before release</text>
<text x="489.5" y="309.0" font-size="11" fill="#b8650a" text-anchor="middle">asserted before release</text>
<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">A thousand bookings suspend without holding a thread each</text>
<text x="480" y="530" font-size="12.5" fill="#555555" text-anchor="middle">All pre-await work runs on one thread; every booking parks at the same await point until a single release drains them all together.</text>
</svg>