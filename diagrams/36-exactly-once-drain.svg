<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="90" width="200" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="120.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a known count submitted</text>
<text x="120.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">producers write, then stop</text>
<rect x="260" y="90" width="200" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="360.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">the writer is completed</text>
<text x="360.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">signals no further events</text>
<rect x="500" y="90" width="200" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="600.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a wait-all over consumers</text>
<text x="600.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">every consumer task finishes</text>
<rect x="740" y="90" width="200" height="100" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="840.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">every event recorded</text>
<text x="840.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">exactly once</text>
<rect x="140" y="300" width="300" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="290.0" y="343.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a single producer</text>
<text x="290.0" y="360.0" font-size="11.5" fill="#555555" text-anchor="middle">writes events in order</text>
<rect x="520" y="300" width="300" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="670.0" y="343.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a single consumer</text>
<text x="670.0" y="360.0" font-size="11.5" fill="#555555" text-anchor="middle">observes the same order</text>
<path d="M220,140 L260,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M460,140 L500,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M700,140 L740,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M440,345 L520,345" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="486.0" y="339.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">channel FIFO</text>
<text x="486.0" y="339.0" font-size="11" fill="#b8650a" text-anchor="middle">channel FIFO</text>
<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">A known count drains to exactly one record per event</text>
<text x="480" y="530" font-size="12.5" fill="#555555" text-anchor="middle">Submitting a known number of events, completing the writer, and waiting for every consumer task to finish proves each event is recorded exactly once; a single producer&#x27;s order survives a single consumer because the channel is first in, first out.</text>
</svg>