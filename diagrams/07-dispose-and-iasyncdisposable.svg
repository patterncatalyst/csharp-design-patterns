<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="35" width="450" height="505" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="55" font-size="12" font-weight="700" fill="#888">using: synchronous cleanup (ManifestWriter)</text>
<rect x="490" y="35" width="450" height="505" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="502" y="55" font-size="12" font-weight="700" fill="#888">await using: asynchronous cleanup (LedgerAppender)</text>
<rect x="60" y="75" width="370" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="245.0" y="108.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">using var writer = new ManifestWriter(path);</text>
<text x="245.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">scope entry: FileStream opened</text>
<rect x="60" y="175" width="370" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="245.0" y="208.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ManifestWriter</text>
<text x="245.0" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">owns the FileStream handle</text>
<rect x="60" y="275" width="370" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="245.0" y="308.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">} // scope exit</text>
<text x="245.0" y="325.0" font-size="11.5" fill="#555555" text-anchor="middle">Dispose() runs now, not at GC</text>
<rect x="60" y="375" width="370" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="245.0" y="410.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">FileStream.Close()</text>
<text x="245.0" y="427.5" font-size="11.5" fill="#555555" text-anchor="middle">handle closed synchronously</text>
<text x="245.0" y="442.5" font-size="11.5" fill="#555555" text-anchor="middle">deterministic, on this thread</text>
<rect x="530" y="75" width="370" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="715.0" y="108.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">await using var appender = new LedgerAppender(path);</text>
<text x="715.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">scope entry: async writer opened</text>
<rect x="530" y="175" width="370" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="715.0" y="208.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">LedgerAppender</text>
<text x="715.0" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">owns an async writer</text>
<rect x="530" y="275" width="370" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="715.0" y="308.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">} // scope exit</text>
<text x="715.0" y="325.0" font-size="11.5" fill="#555555" text-anchor="middle">await DisposeAsync() runs now</text>
<rect x="530" y="375" width="370" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="715.0" y="410.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">flush pending writes, then close</text>
<text x="715.0" y="427.5" font-size="11.5" fill="#555555" text-anchor="middle">asynchronous, awaited at the call site</text>
<text x="715.0" y="442.5" font-size="11.5" fill="#555555" text-anchor="middle">ordering guaranteed: flush completes before close</text>
