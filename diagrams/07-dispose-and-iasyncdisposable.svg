<path d="M245,345 L245,375" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="251.0" y="354.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">Dispose()</text>
<text x="251.0" y="354.0" font-size="11" fill="#555" text-anchor="middle">Dispose()</text>
<path d="M715,145 L715,175" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="721.0" y="154.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">constructs</text>
<text x="721.0" y="154.0" font-size="11" fill="#555" text-anchor="middle">constructs</text>
<path d="M715,245 L715,275" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="721.0" y="254.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">scope ends</text>
<text x="721.0" y="254.0" font-size="11" fill="#555" text-anchor="middle">scope ends</text>
<path d="M715,345 L715,375" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="721.0" y="354.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">await DisposeAsync()</text>
<text x="721.0" y="354.0" font-size="11" fill="#b8650a" text-anchor="middle">await DisposeAsync()</text>
<text x="480" y="20" font-size="11" fill="#888" text-anchor="middle" font-weight="700">Scope exit triggers cleanup immediately, not at garbage collection</text>
</svg>