<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="90" width="920" height="170" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="110" font-size="12" font-weight="700" fill="#888">LazyTariffProvider caches a build failure and rethrows it</text>
<rect x="20" y="330" width="920" height="170" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="350" font-size="12" font-weight="700" fill="#888">a retrying cache would behave differently: not what Lazy does</text>
<rect x="40" y="130" width="150" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="115.0" y="173.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">first call</text>
<text x="115.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">provider.Value</text>
<rect x="226" y="130" width="150" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="301.0" y="173.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ThrowingTariffBuilder</text>
<text x="301.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">Build() throws</text>
<rect x="412" y="130" width="150" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="487.0" y="173.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">exception cached</text>
<text x="487.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">by Lazy initialization</text>
<rect x="598" y="130" width="150" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="673.0" y="173.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">second call</text>
<text x="673.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">provider.Value</text>
<rect x="784" y="130" width="150" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="859.0" y="173.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">same exception</text>
<text x="859.0" y="190.0" font-size="11.5" fill="#555555" text-anchor="middle">rethrown, Assert.Same</text>
<rect x="412" y="370" width="150" height="90" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="487.0" y="413.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">hypothetical retry</text>
<text x="487.0" y="430.0" font-size="11.5" fill="#555555" text-anchor="middle">calls Build() again</text>
<rect x="598" y="370" width="150" height="90" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="673.0" y="413.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">new exception instance</text>
<text x="673.0" y="430.0" font-size="11.5" fill="#555555" text-anchor="middle">not the cached one</text>
<path d="M190,175 L226,175" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M376,175 L412,175" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="400.0" y="169.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">fails</text>
<text x="400.0" y="169.0" font-size="11" fill="#555" text-anchor="middle">fails</text>
<path d="M562,175 L598,175" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M748,175 L784,175" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="772.0" y="169.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">same instance</text>
<text x="772.0" y="169.0" font-size="11" fill="#b8650a" text-anchor="middle">same instance</text>
<path d="M673,220 L487,370" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="586.0" y="289.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">if it retried instead</text>
<text x="586.0" y="289.0" font-size="11" fill="#555" text-anchor="middle">if it retried instead</text>
<path d="M562,415 L598,415" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">A cached build failure is rethrown, never retried</text>
<text x="480" y="530" font-size="12.5" fill="#555555" text-anchor="middle">LazyTariffProvider remembers a failed build and hands every later caller the same cached exception instead of trying again.</text>
</svg>