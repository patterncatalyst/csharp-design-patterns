<text x="480" y="530" font-size="12.5" fill="#555555" text-anchor="middle">Producers publish HandlingEvent values into HandlingEventFeed while a consumer drains it with an await foreach loop. Calling Complete ends the sequence cleanly, and cancelling the token ends it early.</text>
