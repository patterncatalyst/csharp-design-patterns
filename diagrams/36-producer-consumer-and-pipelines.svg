<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="60" width="200" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="120.0" y="103.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">producer</text>
<text x="120.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">writes HandlingEvent values</text>
<rect x="20" y="180" width="200" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="120.0" y="223.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">producer</text>
<text x="120.0" y="240.0" font-size="11.5" fill="#555555" text-anchor="middle">slows when the channel is full</text>
<rect x="20" y="300" width="200" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="120.0" y="343.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">producer</text>
<text x="120.0" y="360.0" font-size="11.5" fill="#555555" text-anchor="middle">writes HandlingEvent values</text>
<rect x="370" y="150" width="220" height="140" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="480.0" y="218.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">bounded channel</text>
<text x="480.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">fills; producers wait for room</text>
<rect x="740" y="60" width="200" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="840.0" y="103.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">consumer</text>
<text x="840.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">drains concurrently</text>
<rect x="740" y="180" width="200" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="840.0" y="223.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">consumer</text>
<text x="840.0" y="240.0" font-size="11.5" fill="#555555" text-anchor="middle">drains concurrently</text>
<rect x="740" y="300" width="200" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="840.0" y="343.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">consumer</text>
<text x="840.0" y="360.0" font-size="11.5" fill="#555555" text-anchor="middle">drains concurrently</text>
<rect x="250" y="460" width="460" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="480.0" y="493.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Writer.Complete signals once</text>
<text x="480.0" y="510.0" font-size="11.5" fill="#555555" text-anchor="middle">every consumer stops after the last event</text>
<path d="M220,105 L370,190" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M220,225 L370,220" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="301.0" y="216.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">backpressure</text>
<text x="301.0" y="216.5" font-size="11" fill="#b8650a" text-anchor="middle">backpressure</text>
<path d="M220,345 L370,250" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M590,190 L740,105" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M590,220 L740,225" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M590,250 L740,345" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M480,290 L480,460" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="486.0" y="369.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">completes the writer</text>
<text x="486.0" y="369.0" font-size="11" fill="#555" text-anchor="middle">completes the writer</text>
<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">Many producers, one bounded channel, many consumers draining it</text>
<text x="480" y="530" font-size="12.5" fill="#555555" text-anchor="middle">Several producers write HandlingEvent values into one bounded channel while several consumers drain it concurrently. A full channel slows the producers, and completing the writer once stops every consumer after the last event.</text>
</svg>