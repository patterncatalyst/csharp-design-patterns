<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">Three modern ways to build a thread-safe singleton</text>
<text x="480" y="530" font-size="12.5" fill="#555555" text-anchor="middle">Lazy initialization, a lock-guarded field, and a static initializer each build the tariff table once; double-checked locking is the older form they replace.</text>
