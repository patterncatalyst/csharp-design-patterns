<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="40" y="58" width="400" height="310" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="52" y="78" font-size="12" font-weight="700" fill="#888">original instance, unchanged</text>
<rect x="520" y="58" width="400" height="310" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="532" y="78" font-size="12" font-weight="700" fill="#888">new instance returned by with</text>
<rect x="60" y="95" width="360" height="95" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="240.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Consignment  (object A)</text>
<text x="240.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">required ConsignmentId = 4471</text>
<text x="240.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">required Weight = 1200 kg</text>
<text x="240.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">init ReferenceNumber = &quot;REF-4471&quot;</text>
<rect x="60" y="210" width="360" height="65" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="240.0" y="240.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Route  (nested record)</text>
<text x="240.0" y="257.5" font-size="11.5" fill="#555555" text-anchor="middle">Chicago  →  Dallas</text>
<rect x="60" y="295" width="360" height="55" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="240.0" y="320.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">object A is never mutated</text>
<text x="240.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">other holders of this reference still see Dallas</text>
<rect x="540" y="95" width="360" height="95" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="720.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Consignment  (object B)</text>
<text x="720.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">required ConsignmentId = 4471</text>
<text x="720.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">required Weight = 1200 kg</text>
<text x="720.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">init ReferenceNumber = &quot;REF-4471&quot;</text>
<rect x="540" y="210" width="360" height="65" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="720.0" y="240.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Route  (nested record, replaced)</text>
<text x="720.0" y="257.5" font-size="11.5" fill="#555555" text-anchor="middle">Chicago  →  Houston</text>
<rect x="540" y="295" width="360" height="55" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="720.0" y="320.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">object B is a distinct instance</text>
<text x="720.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">Destination corrected, every other member copied</text>
<path d="M240,190 L240,210" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M240,275 L240,295" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M720,190 L720,210" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M720,275 L720,295" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M420,142 L540,142" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="486.0" y="132.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">with { Route = ... }</text>
<text x="486.0" y="132.0" font-size="11" fill="#b8650a" text-anchor="middle">with { Route = ... }</text>
<path d="M420,242 L540,242" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="486.0" y="232.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">with { Destination = &quot;Houston&quot; }</text>
<text x="486.0" y="232.0" font-size="11" fill="#b8650a" text-anchor="middle">with { Destination = &quot;Houston&quot; }</text>
<text x="480" y="28" font-size="15" fill="#888" text-anchor="middle" font-weight="700">record with: copy, change the named members, keep the original</text>
<text x="480" y="46" font-size="11" fill="#555555" text-anchor="middle">record = record class by default: reference-type storage, value-based equality and ToString</text>
<text x="480" y="400" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">with copies every member of object A, then overrides the named ones to produce object B.</text>
<text x="480" y="423" font-size="11" fill="#555555" text-anchor="middle">Object A is untouched: nothing in the original is written to, and any other reference to it still sees Dallas.</text>
<text x="480" y="444" font-size="11" fill="#555555" text-anchor="middle">obj1 == obj2 compares member values, not references, so two distinct instances with identical members are equal.</text>
</svg>