<path d="M460,165 L500,165" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="486.0" y="159.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">swap the lock for a gate</text>
<text x="486.0" y="159.0" font-size="11" fill="#555" text-anchor="middle">swap the lock for a gate</text>
<path d="M700,165 L740,165" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="726.0" y="159.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">the queue becomes the gate</text>
