<text x="280.0" y="97.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">SynchronizedStowagePlan</text>
<text x="280.0" y="114.5" font-size="11.5" fill="#555555" text-anchor="middle">Monitor Object: a lock</text>
<text x="280.0" y="129.5" font-size="11.5" fill="#555555" text-anchor="middle">serializes every call, synchronous</text>
