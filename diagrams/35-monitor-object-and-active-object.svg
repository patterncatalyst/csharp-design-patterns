<text x="840.0" y="155.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">StowageActiveObject</text>
<text x="840.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">a bounded queue is the</text>
