<rect x="20" y="55" width="920" height="215" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="75" font-size="12" font-weight="700" fill="#888">one shared, non-thread-safe servant: StowagePlan.TryReserve</text>
<rect x="20" y="85" width="200" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="120.0" y="118.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">SynchronizedStowagePlan</text>
<text x="120.0" y="135.0" font-size="11.5" fill="#555555" text-anchor="middle">Monitor Object: a lock</text>
<rect x="20" y="175" width="200" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="120.0" y="208.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">serializes every call</text>
<text x="120.0" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">synchronous, correct</text>
<rect x="260" y="85" width="200" height="160" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="360.0" y="163.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">await in lock:</text>
<text x="360.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle">rejected at compile time</text>
