<text x="600.0" y="208.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">serializes, but holds the gate</text>
<text x="600.0" y="225.0" font-size="11.5" fill="#555555" text-anchor="middle">across the ledger write</text>
