<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">Four coordination strategies wrap one shared servant</text>
<text x="480" y="530" font-size="12.5" fill="#555555" text-anchor="middle">SynchronizedStowagePlan locks synchronously, awaiting inside that lock fails to compile, SemaphoreStowagePlan awaits inside an async gate, and StowageActiveObject replaces the gate with a bounded queue that serializes access to the same servant.</text>
</svg>