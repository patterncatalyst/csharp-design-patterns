<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="90" width="440" height="380" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="110" font-size="12" font-weight="700" fill="#888">cleared booking</text>
<rect x="500" y="90" width="440" height="380" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="512" y="110" font-size="12" font-weight="700" fill="#888">rejected booking</text>
<rect x="40" y="140" width="400" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="240.0" y="175.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">BookingRequest</text>
<rect x="40" y="220" width="400" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="240.0" y="248.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ClearanceStage</text>
<text x="240.0" y="265.0" font-size="11.5" fill="#555555" text-anchor="middle">ClearanceResult.Cleared = true</text>
<rect x="40" y="300" width="400" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="240.0" y="335.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">InvoiceStage</text>
<rect x="40" y="380" width="400" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="240.0" y="408.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Invoice</text>
<text x="240.0" y="425.0" font-size="11.5" fill="#555555" text-anchor="middle">produced</text>
<rect x="520" y="140" width="400" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="720.0" y="175.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">BookingRequest</text>
<rect x="520" y="220" width="400" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="720.0" y="248.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ClearanceStage</text>
<text x="720.0" y="265.0" font-size="11.5" fill="#555555" text-anchor="middle">ClearanceResult.Cleared = false</text>
<rect x="520" y="300" width="400" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="720.0" y="328.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">No invoice</text>
<text x="720.0" y="345.0" font-size="11.5" fill="#555555" text-anchor="middle">pipeline stops here</text>
<path d="M240,200 L240,220" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M240,280 L240,300" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="246.0" y="284.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">cleared</text>
<text x="246.0" y="284.0" font-size="11" fill="#555" text-anchor="middle">cleared</text>
<path d="M240,360 L240,380" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M720,200 L720,220" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M720,280 L720,300" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="726.0" y="284.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">short-circuits</text>
<text x="726.0" y="284.0" font-size="11" fill="#b8650a" text-anchor="middle">short-circuits</text>
<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">A rejected booking halts before the invoice stage</text>
<text x="480" y="530" font-size="12.5" fill="#555555" text-anchor="middle">Both runs share the same BookingRequest and ClearanceStage. A false ClearanceResult.Cleared stops the pipeline before InvoiceStage, so no Invoice is ever built.</text>
</svg>