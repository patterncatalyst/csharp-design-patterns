<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="90" width="440" height="320" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="110" font-size="12" font-weight="700" fill="#888">one implementation: flagged</text>
<rect x="500" y="90" width="440" height="320" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="512" y="110" font-size="12" font-weight="700" fill="#888">two implementations: quiet</text>
<rect x="120" y="150" width="240" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="240.0" y="178.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">IRatingStrategy</text>
<text x="240.0" y="195.0" font-size="11.5" fill="#555555" text-anchor="middle">one implementation only</text>
<rect x="60" y="250" width="180" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="150.0" y="285.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">StandardRatingStrategy</text>
<rect x="260" y="250" width="180" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="350.0" y="278.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">SHIP0002 fires</text>
<text x="350.0" y="295.0" font-size="11.5" fill="#555555" text-anchor="middle">single implementation</text>
<rect x="600" y="150" width="240" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="720.0" y="178.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">IRatingStrategy</text>
<text x="720.0" y="195.0" font-size="11.5" fill="#555555" text-anchor="middle">two implementations</text>
<rect x="540" y="250" width="180" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="630.0" y="285.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">StandardRatingStrategy</text>
<rect x="740" y="250" width="180" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="830.0" y="285.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ExpressRatingStrategy</text>
<rect x="600" y="340" width="240" height="55" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="720.0" y="365.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">SHIP0002 quiet</text>
<text x="720.0" y="382.5" font-size="11.5" fill="#555555" text-anchor="middle">two implementations present</text>
<path d="M150,250 L180,210" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="171.0" y="224.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">implements</text>
<text x="171.0" y="224.0" font-size="11" fill="#555" text-anchor="middle">implements</text>
<path d="M300,210 L350,250" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M630,250 L660,210" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="651.0" y="224.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">implements</text>
<text x="651.0" y="224.0" font-size="11" fill="#555" text-anchor="middle">implements</text>
<path d="M830,250 L780,210" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="811.0" y="224.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">implements</text>
<text x="811.0" y="224.0" font-size="11" fill="#555" text-anchor="middle">implements</text>
<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">One implementation flags, two implementations stay quiet</text>
<text x="480" y="530" font-size="12.5" fill="#555555" text-anchor="middle">IRatingStrategy with a single implementer trips SHIP0002; adding ExpressRatingStrategy alongside StandardRatingStrategy gives the interface a real second shape and the analyzer goes quiet.</text>
</svg>