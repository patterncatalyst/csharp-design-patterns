<text x="730.0" y="297.5" font-size="11.5" fill="#555555" text-anchor="middle">three arithmetic steps</text>
<text x="730.0" y="312.5" font-size="11.5" fill="#555555" text-anchor="middle">no interface, no factory</text>
<path d="M440,290 L560,290" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="506.0" y="284.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">collapses to</text>
