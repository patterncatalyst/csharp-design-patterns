<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">Collapsing the component tower to one calculation</text>
<text x="480" y="480" font-size="12.5" fill="#555555" text-anchor="middle">There has only ever been one rating scheme; the tower&#x27;s extensibility has never been used.</text>
