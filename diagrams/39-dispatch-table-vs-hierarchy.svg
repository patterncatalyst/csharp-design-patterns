<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="40" width="440" height="480" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="60" font-size="12" font-weight="700" fill="#888">dispatch table</text>
<rect x="500" y="40" width="440" height="480" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="512" y="60" font-size="12" font-weight="700" fill="#888">class-per-case hierarchy (avoided)</text>
<rect x="60" y="90" width="360" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="240.0" y="123.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">DocumentKind</text>
<text x="240.0" y="140.0" font-size="11.5" fill="#555555" text-anchor="middle">five document kinds</text>
<rect x="60" y="220" width="360" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="240.0" y="258.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Handlers</text>
<text x="240.0" y="275.0" font-size="11.5" fill="#555555" text-anchor="middle">FrozenDictionary&lt;DocumentKind, Func&lt;...&gt;&gt;</text>
<rect x="60" y="360" width="360" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="240.0" y="403.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">DocumentRenderers</text>
<text x="240.0" y="420.0" font-size="11.5" fill="#555555" text-anchor="middle">one rendering method per kind</text>
<rect x="540" y="90" width="360" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="720.0" y="123.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">common rendering interface</text>
<text x="720.0" y="140.0" font-size="11.5" fill="#555555" text-anchor="middle">one abstract method</text>
<rect x="540" y="220" width="360" height="80" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="720.0" y="258.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">one class per DocumentKind</text>
<text x="720.0" y="275.0" font-size="11.5" fill="#555555" text-anchor="middle">five renderer subclasses</text>
<rect x="540" y="360" width="360" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="720.0" y="403.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">factory</text>
<text x="720.0" y="420.0" font-size="11.5" fill="#555555" text-anchor="middle">selects an implementation at runtime</text>
<path d="M240,160 L240,220" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M240,300 L240,360" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M720,160 L720,220" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M720,300 L720,360" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">A dispatch table beside the hierarchy it replaces</text>
<text x="480" y="535" font-size="12.5" fill="#555555" text-anchor="middle">Right-sized when the variation is data, not behavior.</text>
</svg>