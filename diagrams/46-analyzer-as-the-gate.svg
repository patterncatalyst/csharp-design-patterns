<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">The analyzer sits as the gate between compilation and diagnostics</text>
<text x="480" y="480" font-size="12.5" fill="#555555" text-anchor="middle">AnalyzerTestHarness compiles each snippet with the raw Roslyn API and runs the analyzer over it: a single-implementation Strategy makes SHIP0002 fire, a two-implementation one leaves it silent.</text>
