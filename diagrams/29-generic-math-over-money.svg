<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="300" y="40" width="360" height="100" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="480.0" y="80.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Money</text>
<text x="480.0" y="97.5" font-size="11.5" fill="#555555" text-anchor="middle">IAdditionOperators, IAdditiveIdentity,</text>
<text x="480.0" y="112.5" font-size="11.5" fill="#555555" text-anchor="middle">IMultiplyOperators, IComparisonOperators, IComparable&lt;Money&gt;</text>
<rect x="60" y="190" width="280" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="200.0" y="235.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">IEnumerable&lt;Money&gt;</text>
<rect x="620" y="190" width="280" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="760.0" y="228.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">IEnumerable&lt;decimal&gt;</text>
<text x="760.0" y="245.0" font-size="11.5" fill="#555555" text-anchor="middle">decimal already implements INumber&lt;decimal&gt;</text>
<rect x="320" y="310" width="320" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="480.0" y="345.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Totals.Sum&lt;T&gt;(values)</text>
<text x="480.0" y="362.5" font-size="11.5" fill="#555555" text-anchor="middle">total = T.AdditiveIdentity</text>
<text x="480.0" y="377.5" font-size="11.5" fill="#555555" text-anchor="middle">total += value foreach</text>
<rect x="280" y="440" width="400" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="480.0" y="475.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Sum&lt;Money&gt; returns a Money total</text>
<text x="480.0" y="492.5" font-size="11.5" fill="#555555" text-anchor="middle">Sum&lt;decimal&gt; returns a decimal total</text>
<text x="480.0" y="507.5" font-size="11.5" fill="#555555" text-anchor="middle">one method body, two concrete T</text>
<path d="M420,140 L200,190" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M200,270 L400,310" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M760,270 L560,310" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M480,400 L480,440" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="480" y="20" font-size="13" fill="#888" text-anchor="middle" font-weight="700">One Sum&lt;T&gt; body, folded from the type&#x27;s own additive identity</text>
</svg>