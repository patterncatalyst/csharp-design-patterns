<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="380" y="40" width="200" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="480.0" y="75.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">RateRequest rule tree</text>
<rect x="60" y="150" width="320" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="220.0" y="190.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ReferencedPropertyCollector : ExpressionVisitor</text>
<text x="220.0" y="207.5" font-size="11.5" fill="#555555" text-anchor="middle">Collect(rule)</text>
<text x="220.0" y="222.5" font-size="11.5" fill="#555555" text-anchor="middle">VisitMember records each RateRequest property touched</text>
<rect x="580" y="150" width="320" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="740.0" y="190.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">RateInflator : ExpressionVisitor</text>
<text x="740.0" y="207.5" font-size="11.5" fill="#555555" text-anchor="middle">Inflate(rule, factor)</text>
<text x="740.0" y="222.5" font-size="11.5" fill="#555555" text-anchor="middle">VisitConstant scales each decimal constant</text>
<rect x="60" y="310" width="260" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="190.0" y="360.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">left: Expression&lt;Func&lt;RateRequest, bool&gt;&gt;</text>
<rect x="640" y="310" width="260" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="770.0" y="360.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">right: Expression&lt;Func&lt;RateRequest, bool&gt;&gt;</text>
<rect x="360" y="310" width="240" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="480.0" y="353.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ParameterReplacer</text>
<text x="480.0" y="370.0" font-size="11.5" fill="#555555" text-anchor="middle">rebinds right.Parameters[0] onto left&#x27;s parameter</text>
<rect x="280" y="440" width="400" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="480.0" y="475.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PredicateComposer.And(left, right)</text>
<text x="480.0" y="492.5" font-size="11.5" fill="#555555" text-anchor="middle">Expression.AndAlso(left.Body, rightBody)</text>
<text x="480.0" y="507.5" font-size="11.5" fill="#555555" text-anchor="middle">one lambda, one shared parameter</text>
<path d="M430,100 L220,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M530,100 L740,150" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M190,400 L400,310" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M770,400 L560,310" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M480,400 L480,440" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="480" y="20" font-size="13" fill="#888" text-anchor="middle" font-weight="700">Expression trees are immutable: every rewrite returns a new tree</text>
</svg>