<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="150" width="200" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="120.0" y="193.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">receive stage</text>
<text x="120.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">producer for its own channel</text>
<rect x="250" y="165" width="120" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="310.0" y="200.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">bounded channel</text>
<rect x="380" y="150" width="200" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="480.0" y="193.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">validate stage</text>
<text x="480.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">a producer and a consumer</text>
<rect x="610" y="165" width="120" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="670.0" y="200.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">bounded channel</text>
<rect x="740" y="150" width="200" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="840.0" y="193.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">record stage</text>
<text x="840.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">consumer draining the pipeline</text>
<path d="M220,195 L250,195" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M370,195 L380,195" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M580,195 L610,195" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M730,195 L740,195" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M480,150 L240,150" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="366.0" y="144.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">backpressure propagates upstream</text>
<text x="366.0" y="144.0" font-size="11" fill="#b8650a" text-anchor="middle">backpressure propagates upstream</text>
<path d="M840,150 L600,150" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">Receive, validate, and record chained over bounded channels</text>
<text x="480" y="530" font-size="12.5" fill="#555555" text-anchor="middle">Receive, validate, and record each run as their own producer and consumer pair, linked by bounded channels. When validate slows down, its full channel propagates backpressure upstream to receive.</text>
