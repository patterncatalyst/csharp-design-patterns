<text x="486.0" y="229.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">Subscribe</text>
<text x="486.0" y="229.0" font-size="11" fill="#555" text-anchor="middle">Subscribe</text>
<path d="M480,400 L480,440" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="480" y="15" font-size="13" fill="#888" text-anchor="middle" font-weight="700">HandlingEventStream publishes through IObservable&lt;T&gt; to RecordingObserver</text>
