<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="20" width="920" height="230" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#888">Result&lt;T&gt;.Map chains without branching</text>
<rect x="20" y="270" width="920" height="270" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="290" font-size="12" font-weight="700" fill="#888">bool + out forces an immediate branch</text>
<rect x="50" y="70" width="230" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="165.0" y="115.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">EdiResultParser</text>
<text x="165.0" y="132.5" font-size="11.5" fill="#555555" text-anchor="middle">.Parse(raw)</text>
<text x="165.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">returns Result&lt;EdiMessage&gt;</text>
<rect x="340" y="70" width="230" height="110" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="455.0" y="123.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">.Map(selector)</text>
<text x="455.0" y="140.0" font-size="11.5" fill="#555555" text-anchor="middle">runs only on success</text>
<rect x="630" y="70" width="270" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="765.0" y="115.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">DeclarationValidator</text>
<text x="765.0" y="132.5" font-size="11.5" fill="#555555" text-anchor="middle">.Validate(candidate)</text>
<text x="765.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">returns Result&lt;CustomsDeclaration&gt;</text>
<rect x="340" y="200" width="230" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="455.0" y="233.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a Failure short-circuits:</text>
<text x="455.0" y="250.0" font-size="11.5" fill="#555555" text-anchor="middle">later steps never run</text>
<rect x="50" y="380" width="230" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="165.0" y="425.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">EdiTryParser</text>
<text x="165.0" y="442.5" font-size="11.5" fill="#555555" text-anchor="middle">.TryParse(raw, out message)</text>
<text x="165.0" y="457.5" font-size="11.5" fill="#555555" text-anchor="middle">returns bool</text>
<rect x="340" y="380" width="230" height="110" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="455.0" y="433.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">if (!ok) return;</text>
<text x="455.0" y="450.0" font-size="11.5" fill="#555555" text-anchor="middle">written at every call site</text>
<rect x="630" y="380" width="270" height="110" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="765.0" y="433.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">caller branches immediately,</text>
<text x="765.0" y="450.0" font-size="11.5" fill="#555555" text-anchor="middle">cannot defer or compose</text>
<path d="M280,125 L340,125" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="316.0" y="119.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">success</text>
<text x="316.0" y="119.0" font-size="11" fill="#b8650a" text-anchor="middle">success</text>
<path d="M570,125 L630,125" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="606.0" y="119.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">chained</text>
<text x="606.0" y="119.0" font-size="11" fill="#555" text-anchor="middle">chained</text>
<path d="M455,180 L455,200" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M280,435 L340,435" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="316.0" y="429.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">out message</text>
<text x="316.0" y="429.0" font-size="11" fill="#555" text-anchor="middle">out message</text>
<path d="M570,435 L630,435" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="606.0" y="429.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">branch now</text>
<text x="606.0" y="429.0" font-size="11" fill="#b8650a" text-anchor="middle">branch now</text>
<text x="480" y="530" font-size="12" fill="#555" text-anchor="middle">the same parse-and-validate decision, chained through failure reasons on one side and branched by hand on the other</text>
</svg>