<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="340" y="50" width="280" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="480.0" y="85.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">TariffExpressionLibrary.WeightRate</text>
<text x="480.0" y="102.5" font-size="11.5" fill="#555555" text-anchor="middle">Expression&lt;Func&lt;RateRequest, decimal&gt;&gt;</text>
<text x="480.0" y="117.5" font-size="11.5" fill="#555555" text-anchor="middle">r =&gt; r.WeightKilograms * 2.50m</text>
<rect x="80" y="220" width="320" height="130" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="240.0" y="268.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">RateDescriber : ExpressionVisitor</text>
<text x="240.0" y="285.0" font-size="11.5" fill="#555555" text-anchor="middle">Describe(rule)</text>
<text x="240.0" y="300.0" font-size="11.5" fill="#555555" text-anchor="middle">Visit(rule.Body)</text>
<text x="240.0" y="315.0" font-size="11.5" fill="#555555" text-anchor="middle">renders the tree as text, never runs it</text>
<rect x="560" y="220" width="320" height="130" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="720.0" y="275.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Expression&lt;T&gt;.Compile()</text>
<text x="720.0" y="292.5" font-size="11.5" fill="#555555" text-anchor="middle">rule.Compile()</text>
<text x="720.0" y="307.5" font-size="11.5" fill="#555555" text-anchor="middle">produces a Func&lt;RateRequest, decimal&gt; delegate</text>
<rect x="80" y="410" width="320" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="240.0" y="453.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">(r.WeightKilograms * 2.50)</text>
<text x="240.0" y="470.0" font-size="11.5" fill="#555555" text-anchor="middle">a string, the tree narrated by hand</text>
<rect x="560" y="410" width="320" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="720.0" y="453.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">delegate(request)</text>
<text x="720.0" y="470.0" font-size="11.5" fill="#555555" text-anchor="middle">a decimal, the rule actually executed</text>
<path d="M420,140 L240,220" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M540,140 L720,220" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M240,350 L240,410" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M720,350 L720,410" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="480" y="24" font-size="13" fill="#888" text-anchor="middle" font-weight="700">One rule authored as data, read two different ways</text>
</svg>