<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="55" width="420" height="440" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="75" font-size="12" font-weight="700" fill="#888">pooled: rent, use, return, reuse</text>
<rect x="500" y="55" width="440" height="440" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="512" y="75" font-size="12" font-weight="700" fill="#888">unpooled: allocate every time</text>
<rect x="60" y="90" width="340" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="230.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Rent</text>
<text x="230.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">ArrayPool.Shared.Rent(size)</text>
<rect x="60" y="200" width="340" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="230.0" y="238.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Fill and use</text>
<text x="230.0" y="255.0" font-size="11.5" fill="#555555" text-anchor="middle">write bytes into the buffer</text>
<rect x="60" y="310" width="340" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="230.0" y="348.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Return, cleared</text>
<text x="230.0" y="365.0" font-size="11.5" fill="#555555" text-anchor="middle">clearArray: true</text>
<rect x="60" y="420" width="340" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="230.0" y="458.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Next Rent</text>
<text x="230.0" y="475.0" font-size="11.5" fill="#555555" text-anchor="middle">hands back the same buffer</text>
<rect x="540" y="90" width="360" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="720.0" y="128.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">new byte[size]</text>
<text x="720.0" y="145.0" font-size="11.5" fill="#555555" text-anchor="middle">allocates a fresh array</text>
<rect x="540" y="200" width="360" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="720.0" y="238.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Fill and use</text>
<text x="720.0" y="255.0" font-size="11.5" fill="#555555" text-anchor="middle">write bytes into the buffer</text>
<rect x="540" y="310" width="360" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="720.0" y="348.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Discard</text>
<text x="720.0" y="365.0" font-size="11.5" fill="#555555" text-anchor="middle">nothing returns it</text>
<rect x="540" y="420" width="360" height="80" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="720.0" y="458.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Next call</text>
<text x="720.0" y="475.0" font-size="11.5" fill="#555555" text-anchor="middle">allocates again: more garbage</text>
<path d="M230,170 L230,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M230,280 L230,310" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M230,390 L230,420" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M720,170 L720,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M720,280 L720,310" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M720,390 L720,420" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">Reusing a rented buffer instead of allocating a fresh array every time</text>
<text x="480" y="530" font-size="12.5" fill="#555555" text-anchor="middle">Renting a buffer, using it, and returning it cleared means the next rent gets back the same array. Allocating a fresh array on every call instead produces garbage with nothing to reuse.</text>
</svg>