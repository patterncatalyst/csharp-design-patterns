<text x="800.0" y="133.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">C: write blocks</text>
<text x="800.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">channel full, task not yet completed</text>
