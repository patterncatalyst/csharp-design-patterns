<text x="480.0" y="388.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GatedStowageLedger</text>
<text x="480.0" y="405.0" font-size="11.5" fill="#555555" text-anchor="middle">A&#x27;s write holds the gate open</text>
