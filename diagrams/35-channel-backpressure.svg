<text x="480.0" y="498.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">release() opens the gate</text>
<text x="480.0" y="515.0" font-size="11.5" fill="#555555" text-anchor="middle">the channel drains and C&#x27;s task completes</text>
