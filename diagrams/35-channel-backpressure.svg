<text x="480" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="700">A full one-slot channel blocks a third reservation until release</text>
<text x="480" y="530" font-size="12.5" fill="#555555" text-anchor="middle">A one-slot channel fills with B while A&#x27;s write holds a gated ledger open. A third reservation&#x27;s write waits until release lets the queue drain, completing C&#x27;s task.</text>
