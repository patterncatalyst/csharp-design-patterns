<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="20" width="920" height="170" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#888">CarrierRegistry</text>
<rect x="50" y="60" width="250" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="175.0" y="93.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Register&lt;TCarrier&gt;(factory)</text>
<text x="175.0" y="110.0" font-size="11.5" fill="#555555" text-anchor="middle">writes _factories[typeof(TCarrier)]</text>
<rect x="360" y="60" width="240" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="480.0" y="93.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Dictionary&lt;Type, object&gt;</text>
<text x="480.0" y="110.0" font-size="11.5" fill="#555555" text-anchor="middle">_factories</text>
<rect x="660" y="60" width="250" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="785.0" y="93.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">FactoryFor&lt;TCarrier&gt;()</text>
<text x="785.0" y="110.0" font-size="11.5" fill="#555555" text-anchor="middle">reads _factories[typeof(TCarrier)]</text>
<rect x="50" y="240" width="320" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="210.0" y="273.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Register&lt;Airco&gt;(new AircoGatewayFactory())</text>
<text x="210.0" y="290.0" font-size="11.5" fill="#555555" text-anchor="middle">one call adds the carrier</text>
<rect x="50" y="350" width="320" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="210.0" y="383.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">FactoryFor&lt;TCarrier&gt;()</text>
<text x="210.0" y="400.0" font-size="11.5" fill="#555555" text-anchor="middle">no entry for typeof(TCarrier)</text>
<rect x="450" y="350" width="320" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="610.0" y="383.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">UnknownCarrierException</text>
<text x="610.0" y="400.0" font-size="11.5" fill="#555555" text-anchor="middle">thrown, not null or a stale factory</text>
<rect x="160" y="460" width="640" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="480.0" y="493.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">A generic&#x27;s type argument is available at runtime</text>
<text x="480.0" y="510.0" font-size="11.5" fill="#555555" text-anchor="middle">so typeof(T) is a reliable, compiler-checked dictionary key</text>
<path d="M300,95 L360,95" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="336.0" y="89.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">typeof(TCarrier) key</text>
<text x="336.0" y="89.0" font-size="11" fill="#b8650a" text-anchor="middle">typeof(TCarrier) key</text>
<path d="M600,95 L660,95" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="636.0" y="89.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">typeof(TCarrier) lookup</text>
<text x="636.0" y="89.0" font-size="11" fill="#b8650a" text-anchor="middle">typeof(TCarrier) lookup</text>
<path d="M210,240 L440,130" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="331.0" y="179.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">new typeof(Airco) entry</text>
<text x="331.0" y="179.0" font-size="11" fill="#b8650a" text-anchor="middle">new typeof(Airco) entry</text>
<path d="M370,385 L450,385" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="416.0" y="379.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">throws</text>
<text x="416.0" y="379.0" font-size="11" fill="#b8650a" text-anchor="middle">throws</text>
<text x="210" y="230" font-size="11" fill="#888" text-anchor="middle" font-weight="700">CarrierRegistry&#x27;s own source never changes</text>
</svg>