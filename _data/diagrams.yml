# Diagram gallery, in file order. Each entry pairs a diagrams/<name>.svg with
# its editable diagrams/<name>.excalidraw source. Registered by the
# orchestrator; content authors produce the files and embed the include but do
# not edit this file.

- name: 00-prerequisites
  section: "Ch. 0"
  title: The local build-and-test loop
  caption: >-
    Editing a source file, running dotnet build, then the xUnit v3 suite
    forms one loop against net10.0: a failing assertion sends you back to the
    source. The loop runs inside a single example and again across every
    example through scripts/verify.sh.

- name: 01-patterns-as-decisions-under-forces
  section: "Ch. 1"
  title: Forces resolving to a rate-quote decision
  caption: >-
    Three competing forces, accuracy, speed, and changeability, each pull a
    rate-quote design in a different direction. The eventual decision is the
    compromise point among all three, not a win for any single force.

- name: 01-forces-first-vs-pattern-first
  section: "Ch. 1"
  title: Starting from forces versus starting from a pattern name
  caption: >-
    Two starting points for the same rate-quote decision. Starting from
    forces lets accuracy, speed, and changeability converge on a fitting
    shape; starting from a pattern name reaches for a four-part structure
    before any force is examined.

- name: 02-what-1994-assumed-and-csharp-invalidated
  section: "Ch. 2"
  title: Three 1994 assumptions, now a language feature
  caption: >-
    Observer, Strategy, and Null Object each existed to compensate for a gap
    in earlier object-oriented languages. C# closes each gap directly: the
    event keyword generates the subscriber list, a delegate replaces the
    strategy interface, and nullable reference types replace the stand-in
    object.

- name: 03-the-divergence-map
  section: "Ch. 3"
  title: The modern C# feature map
  caption: >-
    Ten C# language and runtime features, each mapped against the pattern
    shape it reshapes: events, delegates, LINQ, nullable reference types,
    extension members, expression trees, source generators, generics, static
    abstract members, and value types.

- name: 03-reification-pipeline
  section: "Ch. 3"
  title: How the CLR specializes a generic type
  caption: >-
    A single compile-and-run pipeline for a generic container. Roslyn
    compiles each closed generic as a separate instantiation, and the CLR
    JIT produces distinct, specialized runtime types that store elements
    inline with no boxing. Reification is a CLR guarantee since .NET's
    first release.

- name: 04-naming-patterns-for-teams-and-ai
  section: "Ch. 4"
  title: A pattern name as shared vocabulary
  caption: >-
    One name, Cleared, read the same way by an engineer, a teammate, and an
    AI assistant, each checking the same precondition and postcondition
    against the code. The name carries across the full consignment lifecycle
    from booking to delivery.

- name: 05-srp-ocp-lsp
  section: "Ch. 5"
  title: One calculator split into SRP, OCP, and LSP
  caption: >-
    An overloaded rate calculator resolved into single-responsibility
    collaborators such as IRateQuote. A surcharge decorator composes an
    open extension point for Open/Closed, and two pricing calculators
    substitute for each other through that same contract for Liskov
    Substitution.

- name: 06-isp-dip-and-built-in-di
  section: "Ch. 6"
  title: ISP and DIP through the built-in container
  caption: >-
    A fat carrier-gateway interface splits into narrow rate and tracking
    abstractions. One consumer depends on the narrow abstraction, another
    depends on the full gateway, never on a concrete implementation; the
    built-in DI container is the one place that resolves an abstraction to
    a concrete type.

- name: 06-singleton-fanout-registration
  section: "Ch. 6"
  title: One singleton, three resolvable faces
  caption: >-
    One singleton registration fans out through three factory
    registrations, all resolving back to the same instance. Each consumer
    takes exactly the interface face it needs, a narrow rates view or the
    full gateway, from one shared registration.

- name: 07-dispose-and-iasyncdisposable
  section: "Ch. 7"
  title: Scope exit drives deterministic cleanup
  caption: >-
    A synchronous using scope and an asynchronous await using scope shown
    side by side. Both run cleanup the moment the scope exits rather than
    waiting on the garbage collector: one closes a file handle immediately,
    the other awaits a flush before closing.

- name: 07-dispose-pattern-paths
  section: "Ch. 7"
  title: Three shapes of the dispose pattern
  caption: >-
    Three dispose shapes compared: a sealed type owning only managed
    disposables needs just a guarded Dispose, an unsealed type owning an
    unmanaged handle needs the heavier finalizer pattern, and a type whose
    release must await a flush implements IAsyncDisposable instead.

- name: 08-value-types-struct-span
  section: "Ch. 8"
  title: Inline values and zero-allocation field projection
  caption: >-
    Two record struct values compared side by side, equal by content
    rather than reference, against a reference-type class for contrast. A
    fixed-width record is sliced in place into its typed fields with no
    intermediate string allocation.

- name: 08-fixed-width-edi-layout
  section: "Ch. 8"
  title: The 28-character record as a sliced ruler
  caption: >-
    A fixed-width record laid out as a ruler of labeled field spans at
    their exact offsets. Each span slices directly into its typed
    destination, and every slice is a window over the same backing
    characters rather than its own allocated string.

- name: 09-nrts-records-init-required-with
  section: "Ch. 9"
  title: A record with expression, copy then change, original untouched
  caption: >-
    A consignment record amended through a with expression. The original
    keeps its required and init members exactly as they were, including a
    nested route. The with expression copies every member into a new
    object and overrides only the route, leaving the first untouched.

- name: 09-required-init-construction-gap
  section: "Ch. 9"
  title: The required and init contract, compiles versus CS9035
  caption: >-
    A record's members side by side: required init-only fields, an init
    accessor settable only during construction, a legitimately absent
    optional field, and a plain field with its own default. Omitting a
    required member fails at compile time, never as a suppressible
    warning.

- name: 10-testing-with-xunit-and-nsubstitute
  section: "Ch. 10"
  title: ShipmentRatingEngine under a four-phase test with NSubstitute doubles
  caption: >-
    The four-phase test around a rating engine. Arrange creates NSubstitute
    doubles for its collaborators and stubs their return values, Act calls
    the method once, and Assert checks both the returned result and that
    each substitute was called as expected.

- name: 10-nsubstitute-stub-vs-verify
  section: "Ch. 10"
  title: A substitute's two jobs, stubbing on Arrange and verifying on Assert
  caption: >-
    The same NSubstitute double doing two jobs. Arrange stubs a return
    value, including an async case and per-argument stubbing. Assert reads
    back what the substitute recorded, using argument matchers that work on
    both the stubbing and verification sides.

- name: 11-strategy-delegates-interfaces-keyed-services
  section: "Ch. 11"
  title: One Strategy, three ways to supply it
  caption: >-
    The same rate-pricing strategy supplied three ways: a plain delegate
    with no interface or class, a named interface giving several tariffs a
    shared contract, and a keyed DI container resolving the same tariffs by
    a runtime string key. All three return the same quote.

- name: 11-keyed-service-resolution
  section: "Ch. 11"
  title: Keyed resolution, an unrecognized key, and the non-keyed trap
  caption: >-
    Three pricing strategies are registered as keyed singletons. One
    consumer resolves the matching strategy at runtime; another binds a
    fixed key at construction. An unrecognized key throws or returns null
    depending on the method, and a keyless lookup returns null even
    with keyed registrations present.

- name: 12-template-method-and-the-delegate-alternative
  section: "Ch. 12"
  title: A fixed skeleton, two ways to vary the steps
  caption: >-
    The same three-step customs workflow built two ways. The inheritance
    form seals the step order on an abstract builder so no subclass can
    reorder it; the delegate form moves that order into an engine taking
    functions supplied per country instead of a subclass.

- name: 12-template-method-step-order
  section: "Ch. 12"
  title: One fixed slot order, three countries' content
  caption: >-
    Three fixed workflow slots run in the same order for every country.
    Each slot's position never moves; only its content changes, as each
    country supplies its own required fields, duty formula, and validation
    threshold.

- name: 13-state-and-finite-state-machines
  section: "Ch. 13"
  title: The consignment lifecycle as a finite state machine
  caption: >-
    A state machine drives a consignment through its lifecycle from booked
    to delivered on a sequence of events. One state the enum defines is
    never reached by this machine. An unmatched status-and-event pair is
    rejected with an exception rather than ignored.

- name: 13-probabilistic-transit-model
  section: "Ch. 13"
  title: The stochastic exit from InTransit
  caption: >-
    A probabilistic machine draws a value from an injected random source
    while a consignment is in transit. A low draw delays it and loops back
    for a retry; a higher draw clears and delivers it. A seeded source
    keeps the simulation replayable and testable.

- name: 14-command-undo-and-task-returning-commands
  section: "Ch. 14"
  title: A booking amendment reified as a command
  caption: >-
    A command interface's execute and undo methods back four command
    shapes acting on the same mutable booking, each snapshotting what it
    changes. A queue runs commands first-in-first-out, then unwinds its
    history last-in-first-out on undo, moving commands back and forth
    without reconstructing them.

- name: 14-async-command-undo
  section: "Ch. 14"
  title: The Task-returning command path
  caption: >-
    An async queue awaits each queued command's execute method in strict
    order before dequeuing the next. Undo walks the executed history
    backward one command at a time, and a cancellation token threads
    unchanged through every call beneath it.

- name: 15-factory-method-and-abstract-factory
  section: "Ch. 15"
  title: One overridable step, one matched family, one type-keyed registry
  caption: >-
    A dispatcher fixes a build, send, parse sequence and leaves gateway
    creation as its one overridable step. An abstract factory produces a
    matched gateway, request builder, and response parser as one family
    per carrier, and a registry stores each family keyed by its carrier
    type.

- name: 15-type-keyed-carrier-registry
  section: "Ch. 15"
  title: Registering, resolving, and extending by typeof(T)
  caption: >-
    A registry writes a factory into a dictionary keyed by carrier type
    and reads it back by that key with no cast required. Adding a carrier
    costs one registration call with no edit to the registry; an
    unregistered carrier throws rather than returning null.

- name: 16-builder-required-members-prototype-with
  section: "Ch. 16"
  title: Three paths to the same BookingRequest
  caption: >-
    Three paths reach the same booking request: an object initializer that
    fails to compile on a missing required member, a builder that raises an
    exception on an invalid field, and a cloned template amended with a
    with expression. All three produce an equal record value.

- name: 16-with-prototype-shallow-copy
  section: "Ch. 16"
  title: with leaves the template untouched, the spread leaves it unchanged
  caption: >-
    Cloning a template with a with expression copies every member and
    overrides only the ones named, leaving the template itself untouched.
    Because a reference-typed member is shared rather than copied, a
    collection-expression spread replaces that member with a new list
    instead, growing only the clone.

- name: 17-singleton-lazy-and-di-lifetimes
  section: "Ch. 17"
  title: One tariff table, three ways to guarantee one instance
  caption: >-
    A tariff table guarantees a single instance three ways: a private
    constructor with a static property, a lazily built value, and a DI
    singleton registration with no static field at all. Scoped and
    transient registrations of the same source contrast the lifetimes
    beyond singleton.

- name: 17-di-lifetime-resolution
  section: "Ch. 17"
  title: Same, different, and caught by scope validation
  caption: >-
    A singleton resolution returns the identical instance every time, a
    transient resolution returns a new instance every call, and a scoped
    resolution stays the same within one scope but differs in the next. A
    captive scoped dependency under a singleton becomes a
    startup-validation exception instead.

- name: 18-adapter-facade-bridge
  section: "Ch. 18"
  title: Three carriers, one gateway, one booking call, one label
  caption: >-
    Three native carrier clients with nothing in common are each adapted to
    the same gateway interface. A facade sequences address validation, that
    adapted gateway, and customs filing behind one booking call. A label
    abstraction lets its content and its rendering format vary
    independently.

- name: 18-conversion-operators
  section: "Ch. 18"
  title: Implicit for a safe widening, explicit for anything that can lose data
  caption: >-
    A money type converts to decimal implicitly because the conversion is
    always exact; converting back is explicit because some values cannot
    round-trip without loss. A weight type converts explicitly in both
    directions, since a unit change rather than rounding is what the cast
    signals.

- name: 19-decorator-and-proxy
  section: "Ch. 19"
  title: A fixed wrapping order and a cache standing in the same place
  caption: >-
    A base rate calculator is wrapped by a discount, then a surcharge,
    then a tax decorator, each implementing the same interface as the
    layer underneath. A caching proxy answers a repeated request from its
    own cache instead of the slow gateway.

- name: 19-di-decoration-and-dispatchproxy
  section: "Ch. 19"
  title: A composition root that wraps, and a proxy that intercepts
  caption: >-
    A composition root registers a rate calculator as a factory that wraps
    the base implementation in every decorator, so every consumer resolves
    the same wrapped chain. A dynamic proxy intercepts each call, records
    the invoked member, and forwards it to its target.

- name: 20-composite-and-flyweight
  section: "Ch. 20"
  title: One interface for a leaf and a branch, one instance per code
  caption: >-
    A shared interface gives a leaf and a branch the same weight and
    enumeration surface, so a branch sums and flattens its children
    recursively regardless of nesting. A registry builds its values once
    and hands back the same shared instance on every later lookup.

- name: 20-flyweight-frozen-pool
  section: "Ch. 20"
  title: FrozenDictionary once, shared instances or a named exception after
  caption: >-
    Two registries each build their lookup table once into a frozen
    dictionary, then serve every lookup from that read-optimized
    structure. A known code returns the identical interned instance every
    time; an unrecognized code throws a named exception instead.

- name: 21-observer-the-event-keyword
  section: "Ch. 21"
  title: An event with two subscribers and a retained history
  caption: >-
    A tracker declares one event and raises it through a null-conditional
    invoke, so nobody listening never causes a throw. Two independent
    subscribers can attach and detach without affecting each other, and
    every event is appended to a retained history regardless of who was
    listening.

- name: 21-event-and-iobservable
  section: "Ch. 21"
  title: A hot stream beside an event that remembers
  caption: >-
    A stream wraps a reactive subject and exposes only its observable half,
    so a caller can subscribe but never push a value directly. Because the
    subject has no replay buffer, an observer subscribing late misses
    earlier events, the gap the retained-history tracker never leaves
    open.

- name: 22-mediator-and-chain-of-responsibility
  section: "Ch. 22"
  title: Four stages in order, a halt, and a mediator that picks the route
  caption: >-
    A clearance pipeline wires four stages into one chain, each recording
    its name into a shared context and passing the declaration on only
    while the result stays cleared. A halt stops the chain. A
    separate mediator routes between two colleagues that never reference
    each other.

- name: 22-mediator-colleagues
  section: "Ch. 22"
  title: Two colleagues, one mediator, and no echo back to the sender
  caption: >-
    A mediator is the only thing two colleagues depend on to reach each
    other. Sending a message hands the mediator a reference to the sender,
    never a recipient's name, and the mediator routes by checking identity
    and delivering to whichever colleague did not send it.

- name: 23-iterator-yield-linq-iasyncenumerable
  section: "Ch. 23"
  title: Paginate validates, PaginateIterator is what yield return becomes
  caption: >-
    A pagination method validates its page size up front, then delegates
    the work to a private iterator method. That iterator's yield-return
    body becomes a compiler-generated state machine producing one page at
    a time instead of building the whole list up front.

- name: 23-async-stream-await-foreach
  section: "Ch. 23"
  title: StreamAsync's IAsyncEnumerable, pulled by await foreach, cut short by break
  caption: >-
    An async stream exposes a cancellation token that an await-foreach
    consumer can reach directly instead of a compiler-generated default.
    One consumer reads the stream to completion, while another breaks out
    early, disposing the enumerator and skipping every later event.

- name: 23-deferred-execution
  section: "Ch. 23"
  title: One eager check, two deferred sequences, nothing runs before a pull
  caption: >-
    A pagination method's page-size check is the one piece of eager work.
    Everything after it is deferred: the iterator body does not run until
    a foreach pulls it, and a LINQ query composes lazily rather than
    materializing a list.

- name: 24-visitor-memento-interpreter
  section: "Ch. 24"
  title: One closed TariffRule hierarchy, read by a switch and by a compiler
  caption: >-
    A closed rule hierarchy with a fixed set of cases is read two ways. A
    recursive switch expression walks it directly, the pattern-matching
    alternative to a classic visitor, while a separate compiler walks the
    same hierarchy once into a reusable delegate.

- name: 24-pattern-match-and-compiled-tree
  section: "Ch. 24"
  title: Same tree, two readings, one assertion that they agree
  caption: >-
    A single rule tree is read two ways against the same shipment: a
    recursive switch expression walks it directly, and a compiled delegate
    built from the same tree is invoked instead. A test asserts that both
    readings produce exactly the same result.

- name: 24-memento-checkpoint-rollback
  section: "Ch. 24"
  title: Save into a memento, push it, pop it, Restore from the copy
  caption: >-
    An originator captures its state into a new memento. A caretaker
    pushes it onto a stack without looking inside, and pops the most
    recent one to restore from. Restoring rebuilds its own copy rather
    than aliasing the memento's list.

- name: 25-extension-members
  section: "Ch. 25"
  title: An unowned sealed type, decorated from the outside
  caption: >-
    A sealed vendor type exposes only a constructor and read-only
    properties, standing in for third-party code examples cannot modify. An
    extension class attaches every needed behavior from outside that file,
    instance members, static members, and even an operator, without the
    vendor type ever changing.

- name: 25-extension-block-and-classic-form
  section: "Ch. 25"
  title: Two member-declaration syntaxes, one target type
  caption: >-
    An extension class declares static members inside a C# 14 extension
    block alongside an instance member written with the classic
    extension-method syntax C# has always had. Both forms resolve onto the
    same target type at a call site, coexisting in one static class.

- name: 25-adapting-an-unowned-type
  section: "Ch. 25"
  title: Decorating a type you cannot modify, without mutating it
  caption: >-
    A vendor type's fields never move once constructed, standing in for
    third-party code examples cannot change. An extension class attaches
    read-only members, static members needing no instance, and an operator
    from outside that boundary. One method returns a brand-new instance
    rather than mutating the original.

- name: 26-expression-trees
  section: "Ch. 26"
  title: One rule authored as data, read two different ways
  caption: >-
    A pricing rule is captured as a tree of expression nodes rather than
    compiled code. A visitor walks that tree and renders it as a string
    without ever running it, while compiling the same tree produces a
    delegate, the form that actually executes the rule.

- name: 26-expressionvisitor-rewrite
  section: "Ch. 26"
  title: Visiting without evaluating, and splicing without mutating
  caption: >-
    One visitor records which properties a rule touches without evaluating
    the tree. Another scales every constant by a factor, returning a new
    tree since expression trees are immutable. A third rebinds one rule's
    parameter onto another's and joins both bodies into one lambda.

- name: 26-inspecting-a-tree
  section: "Ch. 26"
  title: Reading a rule without running it, compiling one that does
  caption: >-
    The same expression-tree rule appears on both sides of this figure. A
    visitor records which properties the rule touches without compiling or
    invoking it. Compiling the identical tree instead produces a delegate
    that executes the rule once invoked.

- name: 29-static-abstract-members-and-generic-math
  section: "Ch. 29"
  title: Dispatch through the type parameter, no instance required
  caption: >-
    An interface declares static abstract members that several concrete
    shipment types each implement. A generic method constrained to that
    interface calls the static member through its type parameter and
    reaches whichever concrete type the caller supplied, entirely without
    constructing an instance.

- name: 29-generic-math-over-money
  section: "Ch. 29"
  title: One Sum<T> body over a custom type and a built-in one
  caption: >-
    A money type implements the numeric operator interfaces from the base
    class library. A generic summing method constrained to those
    interfaces seeds its total from the additive identity, the same body
    working for both the money type and a built-in decimal.

- name: 29-irateable-static-dispatch
  section: "Ch. 29"
  title: Three static contracts, one generic quote, one generic total
  caption: >-
    Three concrete shipment types each implement their own static base
    rate and rating formula. A generic method calls the static member for
    whichever type the caller passes, and the resulting quotes feed a
    generic summing method into one aggregate total.

- name: 27-source-generators
  section: "Ch. 27"
  title: One manifest, one generator, no runtime registry
  caption: >-
    A manifest file lists carrier rows. An incremental generator reads it
    at build time and emits one adapter per row, plus a generated
    registry, replacing a hand-written one that would otherwise scan
    loaded assemblies at startup.

- name: 27-incremental-generator-pipeline
  section: "Ch. 27"
  title: Parsing to an equatable model so unchanged input is cached
  caption: >-
    An incremental pipeline turns a manifest file into an equatable model
    wrapping its parsed entries, then merges every parsed manifest into one
    model before emitting output. Because that model compares by value, an
    unchanged manifest produces an unchanged model and the pipeline skips
    emission entirely.

- name: 27-generated-registry-vs-reflection
  section: "Ch. 27"
  title: A compile-time registry needs no runtime scan
  caption: >-
    A generator builds a registry from a manifest at compile time,
    referencing each adapter it emits directly, so a dispatcher resolves a
    carrier from source references alone. The alternative scans loaded
    assemblies at startup, a path trimming can break and AOT does
    not fully support.

- name: 28-roslyn-analyzers
  section: "Ch. 28"
  title: Flagging decimal money on a wire contract at compile time
  caption: >-
    An analyzer inspects every type carrying a wire-contract attribute
    during compilation. Types that model money as integer minor units
    pass, and types without the attribute are never examined. A
    wire-contract type with a decimal money property gets a build-time
    warning at that property's location.

- name: 28-analyzer-diagnostic-pipeline
  section: "Ch. 28"
  title: From compilation start to a reported diagnostic
  caption: >-
    An analyzer registers a compilation-start action that resolves a
    marker attribute and returns early if it is missing. Once resolved, it
    registers a symbol action for every named type, checking for the
    attribute and walking members for a decimal property to report a
    diagnostic on.

- name: 30-the-options-pattern
  section: "Ch. 30"
  title: One options type, bound once, consumed three ways
  caption: >-
    CarrierGatewayOptions binds once from configuration, then reaches
    callers three ways: a long-lived singleton value, a per-request snapshot, and
    a monitor that tracks the current value across reloads.

- name: 30-options-change-notification
  section: "Ch. 30"
  title: A reload reaches the monitor and startup gates on validation
  caption: >-
    When configuration reloads, CarrierGatewayOptions rebinds and
    RetryBudgetWatcher is notified immediately. A validator wired in at
    startup fails the host before any of this runs against bad config.

- name: 30-options-validation-on-start
  section: "Ch. 30"
  title: Collecting every failure before the host ever starts
  caption: >-
    CarrierGatewayOptionsValidator collects every failure reason instead of
    stopping at the first one, then ValidateOnStart fails the host at
    startup, before any caller can use the bad configuration.

- name: 31-tester-doer-and-the-result-debate
  section: "Ch. 31"
  title: One decision, two shapes, Try-Parse beside Result
  caption: >-
    The same parse-and-validate decision appears twice: Try-Parse style
    methods report failure through a boolean, while Result wraps the
    same outcome as a value a caller cannot ignore.

- name: 31-try-parse-vs-result
  section: "Ch. 31"
  title: Branch immediately, or carry the reason and compose
  caption: >-
    A boolean and an out parameter force a caller to branch right away.
    A Result value carries its own failure reason and keeps composing
    through later steps. Neither shape wins outright.

- name: 31-result-composition
  section: "Ch. 31"
  title: Chaining through a failure reason, or branching by hand
  caption: >-
    Result's Map method chains a success through each step and
    short-circuits on the first failure, while the bool-and-out shape
    forces a caller to branch immediately after every call.

- name: 32-tap-and-async-conventions
  section: "Ch. 32"
  title: ICarrierGateway's async surface follows TAP conventions
  caption: >-
    ICarrierGateway follows the Task-based Asynchronous Pattern: every
    async member ends in Async, returns a Task or ValueTask, and accepts
    a cancellation token, so a fake implementation can stand in cleanly.

- name: 32-cancellation-and-progress
  section: "Ch. 32"
  title: Cancellation and progress inside one dispatch loop
  caption: >-
    Dispatching a batch checks for cancellation before each item and
    reports progress after it, so a caller watching the progress
    consumer sees steady updates until a cancellation stops the loop.

- name: 32-task-valuetask-shape
  section: "Ch. 32"
  title: A Task for real work, a ValueTask for the fast path
  caption: >-
    DispatchAsync returns a Task because it awaits real work, while
    IsReachableAsync returns an already-completed ValueTask on its usual
    synchronous path, avoiding an allocation for work that never went async.

- name: 39-shortcut-patterns
  section: "Ch. 39"
  title: One frozen lookup replaces a class-per-case hierarchy
  caption: >-
    DocumentDispatcher.Render looks up a DocumentKind in a FrozenDictionary
    built once at startup and calls the matching renderer directly, with no
    per-kind subclass or switch to maintain.

- name: 39-dispatch-table-vs-hierarchy
  section: "Ch. 39"
  title: A dispatch table beside the hierarchy it replaces
  caption: >-
    The same five document kinds can route through one frozen lookup table
    or through an interface with a class per kind and a factory. The table
    wins when the variation is pure data.

- name: 39-frozen-table-built-once
  section: "Ch. 39"
  title: A frozen table built once, shared by every dispatcher
  caption: >-
    A seed dictionary of document kinds to renderer methods is frozen once
    into the shared Handlers table, and every DocumentDispatcher instance
    reads that one table instead of rebuilding its own copy.

- name: 40-anti-patterns-and-pattern-misuse
  section: "Ch. 40"
  title: Two paths, one identical freight quote
  caption: >-
    A four-type component tower with a factory and an interface computes the
    same freight quote as one static method. Both take the same RateRequest
    and return the identical result.

- name: 40-right-sizing-the-abstraction
  section: "Ch. 40"
  title: Collapsing the component tower to one calculation
  caption: >-
    Seven cooperating types fold into a three-line static method once the
    Strategy and Factory machinery is removed, because this scenario has
    never needed a second rating scheme.

- name: 40-pattern-shaped-llm-output
  section: "Ch. 40"
  title: One review question collapses the AI-generated tower
  caption: >-
    Asked for a freight-rate calculator, an AI assistant drafts the full
    Strategy and Factory tower. A review asks what the second rating scheme
    is, finds none, and collapses it to RateCalculator.Quote's three-line
    static method.

- name: 41-seams-non-virtual-by-default
  section: "Ch. 41"
  title: Opening a seam in a sealed engine
  caption: >-
    A sealed RateEngine with its dependencies built inside offers no way in.
    Adding a constructor and a protected override opens a seam where tests
    and other behavior can substitute collaborators.

- name: 41-c-sharp-seam-kinds
  section: "Ch. 41"
  title: Four seam kinds around one engine
  caption: >-
    Constructor injection, wrapping an ambient clock, a protected override
    hook, and an internal-only entry point open four different seams in the
    same RateEngine, each suited to a different kind of dependency.

- name: 42-dependency-breaking-techniques
  section: "Ch. 42"
  title: Breaking four dependencies out of an engine
  caption: >-
    A rate engine with an audit log, a tariff table, an identifier
    generator, and a clock all created inside itself is rebuilt so each
    becomes an injected collaborator the engine can substitute.

- name: 42-feathers-catalogue-in-c-sharp
  section: "Ch. 42"
  title: The Feathers catalogue applied to one engine
  caption: >-
    Six classic dependency-breaking techniques from Michael Feathers reshape
    the same rate engine, replacing inline construction and ambient calls
    with injected interfaces and a narrow internal seam.

- name: 42-fake-drives-the-engine
  section: "Ch. 42"
  title: A fake drives the engine under test
  caption: >-
    A test substitutes four injected collaborators, including IAuditLog,
    then verifies audit.Received(1).Record(...), the interaction the legacy
    version hid inside a private list.

- name: 43-fowler-vs-feathers
  section: "Ch. 43"
  title: Legacy, seam, and refactor on one engine
  caption: >-
    A sealed legacy rate engine gains a Feathers seam, then a Fowler
    refactor reshapes its structure. The two catalogues combine: opening a
    seam and improving the design are different problems, solved behind
    the same passing tests.

- name: 43-feathers-then-fowler
  section: "Ch. 43"
  title: Two catalogues joined by one bridge
  caption: >-
    Feathers techniques open seams so the untested engine can be exercised
    under test, then Fowler techniques, including Extract Method and
    Replace Conditional with Polymorphism, reshape its structure while
    every test keeps passing.

- name: 43-behaviour-preserved
  section: "Ch. 43"
  title: The refactor keeps behavior intact
  caption: >-
    A shared request and fixed clock feed both SeamedRateEngine and
    RateEngine; a theory test asserts the two engines produce the
    identical amount, proving the refactor changed the engine's shape,
    not its behavior.

- name: 44-refactor-or-rewrite
  section: "Ch. 44"
  title: One contract behind two replacements
  caption: >-
    The legacy engine has no stable seam to build on, but IRateEngine
    gives both a refactored and a rewritten replacement a shared
    contract, so QuoteService can swap one implementation for the other
    with no change of its own.

- name: 44-decision-criteria
  section: "Ch. 44"
  title: Weighing refactor against rewrite
  caption: >-
    Test coverage, change frequency, blast radius, and domain stability
    each weigh toward refactoring in place or rewriting clean. The matrix
    is a judgement aid, not a formula that hands back a verdict.

- name: 44-same-contract-two-paths
  section: "Ch. 44"
  title: Two implementations, one proven contract
  caption: >-
    Two engines sit behind one IRateEngine contract and, fed the same
    request and clock, return record-equal quotes. QuoteService swaps
    between them with a one-line change at the construction site.

- name: 45-final-project
  section: "Ch. 45"
  title: An ordered pipeline from booking to invoice
  caption: >-
    ShipmentPipeline.Run carries a BookingRequest through rating, stowage,
    clearance, and invoicing in order. A rejected ClearanceResult halts the
    run before InvoiceStage, so no Invoice is produced.

- name: 45-patterns-woven
  section: "Ch. 45"
  title: Each stage uses only the pattern it needs
  caption: >-
    RatingStage picks an IRatingStrategy through RatingStrategies.For,
    ClearanceStage returns a ClearanceResult, and InvoiceStage builds with
    InvoiceBuilder. StowageStage needs none of it.

- name: 45-clearance-halts-the-slice
  section: "Ch. 45"
  title: One pipeline, two outcomes
  caption: >-
    A cleared booking runs through InvoiceStage to a finished Invoice. A
    rejected one, with ClearanceResult.Cleared false, stops at
    ClearanceStage and never reaches invoicing.

- name: 46-working-with-ai-and-llm-tools
  section: "Ch. 46"
  title: A human decision gates every change
  caption: >-
    An assistant proposes pattern-shaped code, the SHIP0002 analyzer flags a
    single-implementation Strategy, and a human decides whether to collapse
    the abstraction or justify it before the change merges.

- name: 46-single-implementation-strategy
  section: "Ch. 46"
  title: One implementation flags, two stay quiet
  caption: >-
    An IRatingStrategy with only StandardRatingStrategy behind it trips
    SHIP0002. Adding ExpressRatingStrategy gives the interface a genuine
    second shape, and the analyzer falls silent.

- name: 46-analyzer-as-the-gate
  section: "Ch. 46"
  title: A raw Roslyn test drives the analyzer
  caption: >-
    AnalyzerTestHarness compiles a snippet and runs the analyzer between
    compilation and its diagnostics. A single-implementation Strategy makes
    SHIP0002 fire; a two-implementation one leaves it quiet.

- name: 33-why-dotnet-chose-stackless-async
  section: "Ch. 33"
  title: Thousands of suspended bookings, a handful of threads
  caption: >-
    SailingBookingDesk lets thousands of bookings await
    IBookingLedger.ConfirmAsync at once, each suspended as a small heap
    state object. A handful of pooled threads serve every suspended
    booking, not one thread per booking.

- name: 33-stackless-vs-stackful
  section: "Ch. 33"
  title: Stackful threads prototyped, stackless state machines shipped
  caption: >-
    The .NET team prototyped stackful green threads, where every
    booking reserves a full call stack that grows with concurrency. They
    shipped stackless state machines instead, where a suspended await
    costs a small heap allocation and the thread returns to the pool.

- name: 33-suspended-without-a-thread
  section: "Ch. 33"
  title: A thousand bookings suspend without a thread each
  caption: >-
    A thousand BookingRequest calls start from one calling thread and
    park at the ledger await with zero threads held. A single release
    then drains every suspended booking through one Task.WhenAll.

- name: 34-thread-safe-creation
  section: "Ch. 34"
  title: Built once under concurrent first use
  caption: >-
    Many callers reach LazyTariffProvider.Value at once, but the
    ExecutionAndPublication mode guarantees the underlying builder runs
    exactly once. Every caller is handed the same TariffTable instance.

- name: 34-lazy-vs-lock-vs-static
  section: "Ch. 34"
  title: Three modern ways to build a singleton
  caption: >-
    Three modern idioms each build a TariffTable exactly once: Lazy
    initialization, a lock-guarded field, and a static type initializer.
    Double-checked locking, the historical form they replace, is shown
    as superseded.

- name: 34-exception-caching
  section: "Ch. 34"
  title: A cached failure is rethrown, not retried
  caption: >-
    LazyTariffProvider caches a failed build and rethrows the exact
    same exception to every later caller, instead of retrying. The test
    asserts the first and second failures are the same instance.
