# Diagram gallery, in file order. Each entry pairs a diagrams/<name>.svg with
# its editable diagrams/<name>.excalidraw source. Registered by the
# orchestrator; content authors produce the files and embed the include but do
# not edit this file.

- name: 00-prerequisites
  section: "Ch. 0"
  title: The local build-and-test loop
  caption: >-
    The edit, dotnet build, xUnit v3 run loop every example runs against
    net10.0: a source change is compiled and exercised by the test suite, and
    a failing assertion sends you back to the source. The loop runs standalone
    inside a single example directory, and again across every example at once
    through scripts/verify.sh.

- name: 01-patterns-as-decisions-under-forces
  section: "Ch. 1"
  title: Forces resolving to a rate-quote decision
  caption: >-
    The rating problem as three competing forces, accuracy, speed, and
    changeability, each pulling the rate-quote design in a different
    direction. The eventual decision is the compromise point among all three,
    not a win for any single force.

- name: 01-forces-first-vs-pattern-first
  section: "Ch. 1"
  title: Starting from forces versus starting from a pattern name
  caption: >-
    Two starting points applied to the same rate-quote decision. Forces first
    lets accuracy, speed, and changeability converge on a shape that fits the
    problem; pattern first reaches for a name and gets a four-part structure,
    an interface, two implementations, and a factory, with no force examined
    along the way.

- name: 02-what-1994-assumed-and-csharp-invalidated
  section: "Ch. 2"
  title: Three 1994 assumptions, now a language feature
  caption: >-
    Observer, Strategy, and Null Object each existed to compensate for a gap
    in C++ and Smalltalk. C# closes each gap directly: the event keyword
    generates the subscriber list, a delegate value replaces the strategy
    interface, and nullable reference types make the compiler check for
    absence instead of a stand-in object.

- name: 03-the-divergence-map
  section: "Ch. 3"
  title: The modern C# feature map
  caption: >-
    Ten C# language and runtime features, each mapped against the 1994
    catalogue's pattern shape it reshapes: event, delegates, yield and LINQ,
    nullable reference types, extension members, expression trees, source
    generators, reified generics, static abstract members, and value types.
    The catalogue's own examples were written in C++ and Smalltalk; each
    entry here is a self-contained name a reader can file on sight.

- name: 03-reification-pipeline
  section: "Ch. 3"
  title: How the CLR specializes a generic type
  caption: >-
    A single compile-and-run pipeline for a generic container. Roslyn
    compiles List<int> and List<string> as separate instantiations, and the
    CLR JIT produces two distinct, specialized runtime types, each storing
    its element inline with no boxing. Reification is a CLR guarantee from
    .NET's first release.

- name: 04-naming-patterns-for-teams-and-ai
  section: "Ch. 4"
  title: A pattern name as shared vocabulary
  caption: >-
    One name, Cleared, read the same way by an engineer, a teammate, and an
    AI assistant, each one checking the same precondition and postcondition
    against the code. The name carries across the full consignment lifecycle,
    booked, loaded, in transit, cleared, and delivered.

- name: 05-srp-ocp-lsp
  section: "Ch. 5"
  title: One calculator split into SRP, OCP, and LSP
  caption: >-
    An overloaded rate calculator resolved into single-responsibility
    collaborators, IRateQuote, ITaxPolicy, and IAuditSink. A
    SurchargedRateQuote decorator composes the open ISurcharge extension
    point for Open/Closed, and two pricing calculators substitute for each
    other through one IRateQuote contract for Liskov Substitution.

- name: 06-isp-dip-and-built-in-di
  section: "Ch. 6"
  title: ISP and DIP through the built-in container
  caption: >-
    A fat ICarrierGateway split into ICarrierRates and ICarrierTracking.
    ShipmentRateAdvisor depends on the narrow ICarrierRates abstraction and
    ShipmentBookingService depends on the full ICarrierGateway, never on
    RestCarrierGateway or FakeCarrierGateway directly; the built-in DI
    container is the one place that resolves an abstraction to a concrete
    type.

- name: 06-singleton-fanout-registration
  section: "Ch. 6"
  title: One singleton, three resolvable faces
  caption: >-
    One AddSingleton<TGateway>() registration fans out through three factory
    registrations, ICarrierGateway, ICarrierRates, and ICarrierTracking, all
    resolving GetRequiredService<TGateway>() back to the same singleton
    instance. ShipmentRateAdvisor resolves only ICarrierRates and
    ShipmentBookingService resolves only the full ICarrierGateway, each
    consumer taking exactly the face it uses.

- name: 07-dispose-and-iasyncdisposable
  section: "Ch. 7"
  title: Scope exit drives deterministic cleanup
  caption: >-
    A using scope around ManifestWriter and an await using scope around
    LedgerAppender side by side. Both run their cleanup the moment the scope
    exits rather than waiting on the garbage collector: the synchronous path
    calls Dispose() and closes the underlying FileStream handle on the spot,
    while the asynchronous path awaits DisposeAsync(), which flushes pending
    writes before it closes.

- name: 07-dispose-pattern-paths
  section: "Ch. 7"
  title: Three shapes of the dispose pattern
  caption: >-
    Three dispose shapes compared side by side. A sealed type that owns only
    managed disposables needs nothing more than a guarded Dispose(), an
    unsealed type that owns an unmanaged handle directly takes the heavier
    Dispose(bool disposing), finalizer, and GC.SuppressFinalize(this)
    combination, and a type whose release has to await a flush implements
    IAsyncDisposable instead. ManifestWriter takes the first path and
    LedgerAppender takes the third; the middle path stays a correct choice
    for the day a type actually owns an unmanaged resource on its own.

- name: 08-value-types-struct-span
  section: "Ch. 8"
  title: Inline values and zero-allocation field projection
  caption: >-
    Two readonly record struct values compared side by side, equal by
    content rather than by reference, set against a reference-type class for
    contrast. ReadOnlySpan<char> takes the other half: one fixed-width
    EDI-style record is sliced in place into a consignment ID, a Money, a
    Weight, and a SlotId, with no intermediate string allocation along the
    way.

- name: 08-fixed-width-edi-layout
  section: "Ch. 8"
  title: The 28-character record as a sliced ruler
  caption: >-
    The fixed-width EDI segment laid out as a ruler of six labeled field
    spans at their exact zero-based offsets. Each span slices directly into
    its typed destination, ConsignmentId into int, Bay and Tier into SlotId,
    WeightKilograms into Weight, and Amount and Currency into Money, and all
    four converge on one ConsignmentRecord. Every slice is a window over the
    same backing characters, so no field ever becomes its own allocated
    string before the numeric fields parse through TryParse.

- name: 09-nrts-records-init-required-with
  section: "Ch. 9"
  title: A record with expression, copy then change, original untouched
  caption: >-
    One Consignment record amended through with. The original object keeps
    its required ConsignmentId, Weight, and init ReferenceNumber members
    exactly as they were, including its nested Route record pointing to
    Dallas. The with expression copies every member into a new object and
    overrides only Route, producing a second Consignment that points to
    Houston while the first is never written to. Equality between the two
    compares member values, not references.

- name: 09-required-init-construction-gap
  section: "Ch. 9"
  title: The required and init contract, compiles versus CS9035
  caption: >-
    Consignment's four kinds of member side by side: required, init-only
    ConsignmentId, Route, and Weight the compiler forces a caller to set;
    an init accessor settable only during construction; a legitimately
    absent string? ReferenceNumber; and a non-required DeclaredValue with
    its own default. One object initializer that sets every required
    member compiles; one that leaves Route unset fails at compile time with
    CS9035, never as a suppressible nullable warning.

- name: 10-testing-with-xunit-and-nsubstitute
  section: "Ch. 10"
  title: ShipmentRatingEngine under a four-phase test with NSubstitute doubles
  caption: >-
    The four-phase test around ShipmentRatingEngine. Arrange creates
    NSubstitute doubles for ICarrierRates, ITaxPolicy, and IAuditSink and
    stubs their return values, then constructs the engine against those
    three interfaces. Act calls QuoteAsync once. Assert splits into two
    checks on the result: the returned quote value, and Received()
    verification that each substitute was called exactly as expected.

- name: 10-nsubstitute-stub-vs-verify
  section: "Ch. 10"
  title: A substitute's two jobs, stubbing on Arrange and verifying on Assert
  caption: >-
    The same NSubstitute double doing two separate jobs. On the left, Arrange
    stubs a return value with Substitute.For and .Returns, including the
    async GetBaseRateAsync case that wraps a plain value in a completed
    Task, per-argument stubbing, and the type-default fallback for a call
    nobody stubbed. On the right, Assert reads back what the substitute
    recorded with Received(1), DidNotReceive(), and the Arg.Any and Arg.Is
    matchers, including the await an async Received check needs. Arg
    matchers work on both sides, narrowing a stub or a verification to the
    argument that actually matters.

- name: 11-strategy-delegates-interfaces-keyed-services
  section: "Ch. 11"
  title: One Strategy, three ways to supply it
  caption: >-
    The same rate-pricing Strategy collapsed to three different shapes, each
    with its own caller. A plain Func<RateRequest, Money> drops the interface
    and the class entirely, consumed by DelegateRateQuoter; IPricingStrategy
    names the abstraction and gives StandardTariff, ExpressTariff, and
    EconomyTariff a shared contract, consumed by StrategyRateQuoter; a keyed
    DI container resolves the same three tariffs by a runtime string key,
    consumed by KeyedTariffQuoter and, for a fixed key chosen at
    construction, ExpressLaneQuoter. All three quoters take the same
    RateRequest in and return the same RateQuote out no matter which level
    supplied the strategy.

- name: 11-keyed-service-resolution
  section: "Ch. 11"
  title: Keyed resolution, an unrecognized key, and the non-keyed trap
  caption: >-
    The keyed-DI composition root in AddRateQuoting registering three
    IPricingStrategy implementations as keyed singletons under "standard",
    "express", and "economy". KeyedTariffQuoter resolves the matching one at
    runtime with GetRequiredKeyedService(request.ServiceLevel);
    ExpressLaneQuoter binds a fixed key at construction with
    [FromKeyedServices("express")]. An unrecognized key splits behavior:
    GetRequiredKeyedService throws InvalidOperationException, while
    GetKeyedService returns null. A plain, keyless GetService<IPricingStrategy>()
    also returns null, even with three keyed registrations in the container,
    because keyed and non-keyed lookups are separate graphs.

- name: 12-template-method-and-the-delegate-alternative
  section: "Ch. 12"
  title: A fixed skeleton, two ways to vary the steps
  caption: >-
    The same three-step customs workflow, CollectRequiredFields, then
    CalculateDuty, then Validate, built two ways. The inheritance form seals
    Build() on an abstract CustomsDeclarationBuilder so no subclass can
    reorder the steps, while UnitedStatesDeclarationBuilder,
    GermanyDeclarationBuilder, and JapanDeclarationBuilder override each
    step for their own tariff rules. The delegate form moves the same
    sealed order into DeclarationEngine.Build(), which takes a
    DeclarationSteps record of Func<> values supplied per country by
    CountrySteps instead of a subclass. Both paths produce the same
    CustomsDeclaration; only the steps vary by country, never the order
    they run in.

- name: 12-template-method-step-order
  section: "Ch. 12"
  title: One fixed slot order, three countries' content
  caption: >-
    The same three fixed slots, CollectRequiredFields, CalculateDuty, and
    Validate, running left to right in that order for every country. Each
    slot's box never moves; only the content plugged into it changes: the
    United States, Germany, and Japan each supply their own required
    fields, their own duty formula (2.5% USD, 19% EUR, or 5% plus a flat
    2000 JPY handling fee), and their own validation threshold. The order
    is the one thing all three countries share; the slot contents are the
    one thing that is never shared between them.

- name: 13-state-and-finite-state-machines
  section: "Ch. 13"
  title: The consignment lifecycle as a finite state machine
  caption: >-
    ConsignmentStateMachine.Apply(HandlingEvent) drives every move through
    Transitions.Next, advancing Booked to Loaded to InTransit to Cleared to
    Delivered on the Load, Depart, ClearCustoms, and Deliver events.
    Delayed sits off InTransit as a state the enum defines but that
    Transitions.Next never reaches; only the probabilistic variant drives a
    consignment there. An unmatched (status, event) pair, delivering a
    booked consignment included, is rejected rather than ignored: the
    switch expression's catch-all arm throws InvalidTransitionException
    instead of returning a placeholder status.

- name: 13-probabilistic-transit-model
  section: "Ch. 13"
  title: The stochastic exit from InTransit
  caption: >-
    ProbabilisticTransitMachine.Step draws a value from an injected
    IRandomSource.NextDouble() at InTransit. A draw below delayProbability
    sends the consignment to Delayed, which maps straight back to InTransit
    so the next Step retries the same exit; a draw at or above the
    threshold progresses the consignment to Cleared and then Delivered.
    SeededRandomSource wraps that draw in a seeded System.Random, so two
    machines built on the same seed replay the identical sequence of draws
    and therefore the identical sequence of statuses, which is what keeps
    the simulation testable.

- name: 14-command-undo-and-task-returning-commands
  section: "Ch. 14"
  title: A booking amendment reified as a command
  caption: >-
    IBookingCommand's two methods, Execute and Undo, back four shapes that
    all act on the same mutable Booking: ChangeServiceLevelCommand and
    ChangeWeightCommand each snapshot the prior value before overwriting
    it, AddLineItemCommand's own added LineItem is its snapshot, and
    DelegateCommand wraps a pair of Action values for a change that does not
    need its own class. AmendmentQueue enqueues and runs those commands
    first-in-first-out, then unwinds its execution history
    last-in-first-out on Undo, with Redo moving a command back from the
    undone stack to the history stack without ever reconstructing it.

- name: 14-async-command-undo
  section: "Ch. 14"
  title: The Task-returning command path
  caption: >-
    AsyncAmendmentQueue.RunAsync awaits each queued
    IAsyncBookingCommand.ExecuteAsync in strict FIFO order before dequeuing
    the next one; ConfirmAmendmentCommand's ExecuteAsync calls
    IAmendmentGateway.ConfirmAsync with ConfigureAwait(false), and its
    UndoAsync calls RevertAsync the same way. UndoAsync walks the executed
    history back one command at a time, and the caller's CancellationToken
    threads unchanged from RunAsync and UndoAsync through to every
    ConfirmAsync and RevertAsync call beneath them, which is what lets the
    queue preserve order and reverse through the gateway rather than a
    plain in-memory field.

- name: 15-factory-method-and-abstract-factory
  section: "Ch. 15"
  title: One overridable step, one matched family, one type-keyed registry
  caption: >-
    CarrierDispatcher fixes a build, send, parse sequence and leaves
    CreateGateway as its one overridable step, matched by
    DelegateCarrierDispatcher through a constructor-supplied
    Func<ICarrierGateway> instead of a subclass.
    ICarrierGatewayFactory<TCarrier> produces a matched ICarrierGateway,
    IShipmentRequestBuilder, and IShipmentResponseParser as one family per
    carrier, and CarrierRegistry stores each family by typeof(TCarrier), so
    a dispatch resolves one by its reified type argument and returns a
    ShipmentConfirmation.

- name: 15-type-keyed-carrier-registry
  section: "Ch. 15"
  title: Registering, resolving, and extending by typeof(T)
  caption: >-
    CarrierRegistry.Register<TCarrier> writes a factory into a
    Dictionary<Type, object> keyed by typeof(TCarrier), and FactoryFor
    reads it back by the identical key with no cast a caller has to write.
    Adding Airco costs one Register<Airco> call with no edit to
    CarrierRegistry itself, while asking for a carrier that was never
    registered throws UnknownCarrierException rather than returning null or
    a stale factory. A generic method's type argument is available at the
    point it runs, which is what makes typeof(T) a reliable dictionary key.

- name: 16-builder-required-members-prototype-with
  section: "Ch. 16"
  title: Three paths to the same BookingRequest
  caption: >-
    An object initializer that sets the required Origin, Destination, and
    DeclaredValue members fails to compile under CS9035 if one is missing.
    BookingRequestBuilder.Build() accumulates state through fluent calls
    and raises BookingValidationException on a missing or invalid field
    instead. BookingTemplates.StandardDomestic is cloned and amended with a
    with expression. All three paths produce a BookingRequest that
    Assert.Equal confirms is an equal record value.

- name: 16-with-prototype-shallow-copy
  section: "Ch. 16"
  title: with leaves the template untouched, the spread leaves it unchanged
  caption: >-
    Cloning BookingTemplates.StandardDomestic with a with expression copies
    every member and overrides only the ones named, leaving the template
    itself untouched. LineItems is a reference-typed member, so a with
    expression that never mentions it shares the template's own list; the
    collection-expression spread, LineItems = [.. template.LineItems,
    extra], replaces that member with a brand-new list instead, so the
    amended clone's item count grows by one while the template's own count
    stays exactly where it was.

- name: 17-singleton-lazy-and-di-lifetimes
  section: "Ch. 17"
  title: One tariff table, three ways to guarantee one instance
  caption: >-
    ClassicTariffTable guarantees one instance with a private constructor
    and a static Instance property, LazyTariffTable guarantees it with a
    Lazy<TariffTable> built ExecutionAndPublication, and an AddSingleton
    registration gets the same guarantee from the built-in DI container
    with no static field at all. AddScoped and AddTransient registrations
    of the same CountingTariffSource contrast the lifetimes beyond
    Singleton, and CountingTariffSource.LoadCount stays at one across every
    tier.

- name: 17-di-lifetime-resolution
  section: "Ch. 17"
  title: Same, different, and caught by scope validation
  caption: >-
    A singleton resolution returns the identical TariffTable every time,
    Assert.Same; a transient resolution of CountingTariffSource returns a
    new instance every call, Assert.NotSame; and a scoped resolution
    returns the same instance within one scope but a different one in the
    next. Registering ITariffSource as scoped under an AddSingleton
    LazyTariffTable and building the provider with ServiceProviderOptions
    ValidateScopes = true turns that captive dependency into an
    InvalidOperationException at resolution time, and
    CountingTariffSource.LoadCount still never exceeds one.

- name: 18-adapter-facade-bridge
  section: "Ch. 18"
  title: Three carriers, one gateway, one booking call, one label
  caption: >-
    FastlineSoapClient, SeabrightRestClient, and AircoLegacyClient are three
    native carrier clients with nothing in common, each adapted to the same
    ICarrierGateway by its own FastlineGatewayAdapter, SeabrightGatewayAdapter,
    or AircoGatewayAdapter. ShipmentBookingFacade sequences an
    IAddressValidator, that adapted ICarrierGateway, and an ICustomsFiler
    behind one Book call and returns a ShipmentConfirmation. ShipmentLabel is
    the Bridge abstraction: StandardShipmentLabel and ReturnShipmentLabel each
    build their own content and render it through whichever ILabelRenderer
    they were constructed with, PdfLabelRenderer or ZplLabelRenderer, so a
    label kind and an output format vary independently.

- name: 18-conversion-operators
  section: "Ch. 18"
  title: Implicit for a safe widening, explicit for anything that can lose data
  caption: >-
    Money converts out to decimal implicitly, because every cent count maps
    to one exact dollars-and-cents figure, and ToDecimal is the named
    alternate a caller can reach without the operator syntax. Converting a
    decimal back down to Money is explicit, because a value like 1.005m has
    no exact whole-cent representation, and FromDecimal names that same
    rounding step. Kilograms and Pounds convert explicitly in both
    directions instead, since a unit change, not a rounding of the same
    figure, is what the cast signals there, and ToPounds and ToKilograms
    name each direction by hand.

- name: 19-decorator-and-proxy
  section: "Ch. 19"
  title: A fixed wrapping order and a cache standing in the same place
  caption: >-
    BaseRateCalculator is wrapped by DiscountRateDecorator, then
    SurchargeRateDecorator, then TaxRateDecorator, each implementing the
    same IRateCalculator as the layer underneath it, carrying a 100-kilogram
    quote from 500.00 to 450.00 to 472.50 to 510.30 as it passes through.
    CachingRateGatewayProxy implements the identical ICarrierRateGateway as
    the SlowCarrierRateGateway it wraps, and answers a repeated request from
    its own cache instead of calling the slow gateway again.

- name: 19-di-decoration-and-dispatchproxy
  section: "Ch. 19"
  title: A composition root that wraps, and a proxy that intercepts
  caption: >-
    ServiceCollectionExtensions.AddRatePipeline registers IRateCalculator as
    a factory that resolves BaseRateCalculator from the container and wraps
    it in all three decorators, so every consumer that asks for
    IRateCalculator resolves the same fully wrapped chain. LoggingRateProxy,
    a DispatchProxy subclass, intercepts every call made through it in
    Invoke, records the invoked member in InvokedMembers, and forwards the
    call to its own Target; RateProxyFactory.Wrap is the one place that
    builds the proxy and assigns that Target.

- name: 20-composite-and-flyweight
  section: "Ch. 20"
  title: One interface for a leaf and a branch, one instance per code
  caption: >-
    IConsignmentNode gives a ShipmentParcel leaf and a Consolidation branch
    the same TotalWeightKilograms and Parcels() surface, so a Consolidation
    sums and flattens its children recursively whether a child is another
    parcel or another consolidation nested underneath it. PortCodeRegistry
    builds its set of PortCode values once and hands back the same shared
    instance on every later Get call, so two parcels bound for the same port
    point at the identical object rather than two separately built copies.

- name: 20-flyweight-frozen-pool
  section: "Ch. 20"
  title: FrozenDictionary once, shared instances or a named exception after
  caption: >-
    PortCodeRegistry and CommodityCodeRegistry each build their lookup table
    once with ToFrozenDictionary into a FrozenDictionary<string, PortCode>
    or a FrozenDictionary<string, CommodityCode>, then serve every later
    lookup from that same read-optimized structure. A known code returns
    the identical interned instance on every call, the reference equality
    Assert.Same checks directly, while an unrecognized code throws
    UnknownPortCodeException or UnknownCommodityCodeException instead of
    returning a stale or default value.

- name: 21-observer-the-event-keyword
  section: "Ch. 21"
  title: An event with two subscribers and a retained history
  caption: >-
    ConsignmentTracker declares one event, EventHandler<HandlingReportedEventArgs>?
    HandlingReported, and raises it from Report through a null-conditional
    Invoke, so a tracker with nobody listening never throws. CustomerNotifier
    and AuditLog each subscribe with += and can detach with -=, and either one
    can stop listening without changing what the other one receives. Report
    also appends each HandlingEvent to History before the event ever fires, so
    a reader can ask the tracker what happened regardless of who was
    listening at the time it happened.

- name: 21-event-and-iobservable
  section: "Ch. 21"
  title: A hot stream beside an event that remembers
  caption: >-
    HandlingEventStream wraps a System.Reactive Subject<HandlingEvent> and
    exposes only the IObservable<HandlingEvent> half through Events, so a
    caller can subscribe but never push a value into it directly. Publish
    forwards to OnNext and Complete forwards to OnCompleted, delivering to
    whichever RecordingObserver instances are already subscribed at that
    moment. The Subject is a hot sequence with no replay buffer, so a
    RecordingObserver that subscribes after an earlier Publish misses that
    event entirely, the one gap ConsignmentTracker's retained History never
    leaves open.

- name: 22-mediator-and-chain-of-responsibility
  section: "Ch. 22"
  title: Four stages in order, a halt, and a mediator that picks the route
  caption: >-
    CustomsClearancePipeline.Standard wires DocumentCheckStage,
    DutyCalculationStage, InspectionStage, and ReleaseStage into one chain
    through SetNext, with every ClearanceStage.Handle call recording its own
    stage name into a shared ClearanceContext and passing the declaration on
    only while the running ClearanceResult stays cleared. A halt at any stage
    returns a non-cleared ClearanceResult immediately, and every stage after
    it is never reached. CustomsMediator, implementing IClearanceMediator,
    separately routes a message between DeclarationDesk and DutyDesk, two
    colleagues that never hold a reference to each other.

- name: 22-mediator-colleagues
  section: "Ch. 22"
  title: Two colleagues, one mediator, and no echo back to the sender
  caption: >-
    CustomsMediator implements IClearanceMediator and is the only thing
    DeclarationDesk and DutyDesk depend on to reach each other; calling Send
    hands the mediator a message and a reference to the sender itself, never
    the name of a recipient. CustomsMediator routes by checking
    ReferenceEquals against each registered colleague and delivers to
    whichever one did not send the message, so a reply travels the same
    path in the other direction without either desk ever holding a direct
    reference back to the one that sent it.

- name: 23-iterator-yield-linq-iasyncenumerable
  section: "Ch. 23"
  title: Paginate validates, PaginateIterator is what yield return becomes
  caption: >-
    ConsignmentHistory.Paginate(pageSize) validates pageSize and throws
    immediately on an invalid value, then returns without running any
    pagination logic itself, delegating that work to the private
    PaginateIterator method. PaginateIterator is where the yield return
    statements live, and the compiler turns that method body into a state
    machine that does nothing until a caller's foreach calls MoveNext,
    producing one TrackingPage at a time rather than building the whole
    list up front.

- name: 23-async-stream-await-foreach
  section: "Ch. 23"
  title: StreamAsync's IAsyncEnumerable, pulled by await foreach, cut short by break
  caption: >-
    CarrierEventFeed.StreamAsync returns an async IAsyncEnumerable<TrackingEvent>
    and marks its CancellationToken parameter with [EnumeratorCancellation], the
    attribute that lets a consumer's .WithCancellation(ct) on the await foreach
    reach that same parameter instead of a default token the compiler would
    otherwise generate. LiveTrackingReader.CollectAsync consumes the stream to
    completion, while CollectUntilAsync breaks out of its await foreach once
    trackingEvent.Stage matches the requested stop stage, which disposes the
    enumerator early and leaves every event after that point never requested
    from the feed.

- name: 23-deferred-execution
  section: "Ch. 23"
  title: One eager check, two deferred sequences, nothing runs before a pull
  caption: >-
    ConsignmentHistory.Paginate(pageSize) is the one piece of eager work,
    checked and thrown before the method ever returns. Everything after it is
    deferred: the private PaginateIterator body does not run until a foreach
    calls MoveNext, and StagesReached()'s _events.Select(e => e.Stage).Distinct()
    is itself a LINQ query that composes lazily over the same source rather
    than materializing a list. Both sequences sit inert until the first
    foreach iteration pulls an element through them.

- name: 24-visitor-memento-interpreter
  section: "Ch. 24"
  title: One closed TariffRule hierarchy, read by a switch and by a compiler
  caption: >-
    TariffRule is a closed abstract record with exactly four cases, FlatFee,
    PerKilogram, Surcharge, and Sum, each capturing its own data. TariffEvaluator
    .Evaluate(rule, shipment) walks that hierarchy with a recursive switch
    expression and returns a decimal directly, the pattern-matching
    alternative to a classic Visitor's double dispatch. TariffCompiler.Compile
    (rule) walks the same hierarchy once to build a System.Linq.Expressions
    tree, then calls Expression.Lambda<Func<Shipment,decimal>>(...).Compile()
    to produce a reusable delegate, the GoF Interpreter pattern as originally
    described.

- name: 24-pattern-match-and-compiled-tree
  section: "Ch. 24"
  title: Same tree, two readings, one assertion that they agree
  caption: >-
    A single TariffRule tree, a Sum of a Surcharge over PerKilogram and a
    FlatFee, is read two ways against the same Shipment: TariffEvaluator
    .Evaluate(tree, shipment) walks it with a recursive switch expression,
    and TariffCompiler.Compile(tree)(shipment) invokes the compiled delegate
    built from the same tree. The test
    Compiled_delegate_matches_the_pattern_matching_evaluator asserts
    TariffEvaluator.Evaluate(tree, Shipment) equals compiled(Shipment), the
    decimal from one reading matching the decimal from the other exactly.

- name: 24-memento-checkpoint-rollback
  section: "Ch. 24"
  title: Save into a memento, push it, pop it, Restore from the copy
  caption: >-
    BookingOriginator.Save() captures ServiceLevel, WeightKilograms, and a
    copy of Lines into a new BookingMemento. AmendmentCaretaker.Checkpoint
    pushes that memento onto its own Stack<BookingMemento> without ever
    looking inside it, and Rollback pops the most recent one and hands it to
    BookingOriginator.Restore(memento). Restore rebuilds _lines with
    [.. memento.Lines] rather than aliasing the memento's list, so a later
    mutation on the restored booking can never reach back into the snapshot
    the caretaker is still holding.

- name: 25-extension-members
  section: "Ch. 25"
  title: An unowned sealed type, decorated from the outside
  caption: >-
    CarrierShipment is a sealed vendor type with a constructor and read-only
    WeightGrams, DestinationCode, and DeclaredValueMinorUnits properties only,
    a stand-in for a third-party SDK this book's examples cannot modify.
    CarrierShipmentExtensions attaches every behavior those examples need from
    outside that file: instance extension properties WeightKilograms and
    IsHeavy, an instance extension method WithAddedWeight, static extension
    members Empty and FromKilograms, and an extension operator +, all without
    CarrierShipment.cs ever changing again.

- name: 25-extension-block-and-classic-form
  section: "Ch. 25"
  title: Two member-declaration syntaxes, one target type
  caption: >-
    CarrierShipmentExtensions declares its static extension members inside an
    extension(CarrierShipment) block, the C# 14 form that produces Empty and
    FromKilograms(kilograms, destinationCode). The same static class also
    declares NormalisedDestination with the classic this CarrierShipment
    shipment parameter, the extension-method syntax C# has always had. Both
    forms resolve onto CarrierShipment at a call site, coexisting in the one
    static class.

- name: 25-adapting-an-unowned-type
  section: "Ch. 25"
  title: Decorating a type you cannot modify, without mutating it
  caption: >-
    CarrierShipment sits inside CarrierParcels.Vendor, a stand-in for
    third-party SDK code this book's examples cannot change: its
    WeightGrams, DestinationCode, and DeclaredValueMinorUnits never move
    once constructed. CarrierShipmentExtensions attaches every behavior
    from outside that boundary, instance extension members
    WeightKilograms and IsHeavy that read the shipment without touching
    it, static extension members Empty and FromKilograms that need no
    instance at all, and the extension operator + with its Add
    alternate. WithAddedWeight(grams) makes the no-mutation rule
    concrete: it reads shipment.WeightGrams and returns new(...), a
    brand-new CarrierShipment, leaving the original the vendor handed
    over exactly as it was.

- name: 26-expression-trees
  section: "Ch. 26"
  title: One rule authored as data, read two different ways
  caption: >-
    TariffExpressionLibrary.WeightRate is an
    Expression<Func<RateRequest, decimal>>, the lambda r => r.WeightKilograms
    * 2.50m captured as a tree of Expression nodes rather than compiled code.
    RateDescriber, an ExpressionVisitor, calls Visit(rule.Body) inside
    Describe(rule) and renders that tree as a string without ever running it.
    Expression<T>.Compile() takes the same tree and produces a
    Func<RateRequest, decimal> delegate, the form that actually executes the
    rule against a RateRequest.

- name: 26-expressionvisitor-rewrite
  section: "Ch. 26"
  title: Visiting without evaluating, and splicing without mutating
  caption: >-
    ReferencedPropertyCollector, an ExpressionVisitor, overrides VisitMember
    inside Collect(rule) to record which RateRequest properties a rule
    touches, never evaluating the tree. RateInflator overrides VisitConstant
    inside Inflate(rule, factor) to scale every decimal constant by a factor,
    returning a brand-new Expression<Func<RateRequest, decimal>> because
    expression trees are immutable. PredicateComposer.And(left, right) uses a
    ParameterReplacer to rebind right's parameter onto left's, then joins the
    two bodies with Expression.AndAlso into a single lambda over one shared
    parameter.

- name: 26-inspecting-a-tree
  section: "Ch. 26"
  title: Reading a rule without running it, compiling one that does
  caption: >-
    TariffExpressionLibrary.WeightRate is the same kind of
    Expression<Func<RateRequest, decimal>> rule on both sides of this
    figure. ReferencedPropertyCollector, an ExpressionVisitor, calls
    Visit(rule.Body) inside Collect(rule) and its VisitMember override
    records which RateRequest properties, such as WeightKilograms, the
    rule touches, producing an IReadOnlyCollection<string> without ever
    compiling or invoking the rule. Expression<Func<RateRequest,
    decimal>>.Compile() takes the identical tree down a different path:
    it produces a Func<RateRequest, decimal> delegate that, once
    invoked against a RateRequest, actually executes the rule, the
    LINQ-provider distinction between inspecting a tree as data and
    running it as code.

- name: 29-static-abstract-members-and-generic-math
  section: "Ch. 29"
  title: Dispatch through the type parameter, no instance required
  caption: >-
    IRateable<TSelf> declares static abstract Money BaseRate and static
    abstract Money RateOf(TSelf shipment), a contract three concrete
    shipment types each implement: ParcelShipment, FreightPallet, and
    DocumentEnvelope. RateBook.Quote<T>(shipment), constrained to where T :
    IRateable<T>, calls T.RateOf(shipment) and reaches whichever concrete
    type's static member the caller supplied, entirely through the type
    parameter, with RateBook.BaseRateOf<T>() reading T.BaseRate the same way
    without constructing an instance at all.

- name: 29-generic-math-over-money
  section: "Ch. 29"
  title: One Sum<T> body over a custom type and a built-in one
  caption: >-
    Money implements IAdditionOperators<Money, Money, Money>,
    IAdditiveIdentity<Money, Money>, IMultiplyOperators<Money, decimal, Money>,
    IComparisonOperators<Money, Money, bool>, and IComparable<Money> from
    System.Numerics. Totals.Sum<T>(values), constrained to
    IAdditionOperators<T, T, T> and IAdditiveIdentity<T, T>, seeds its total
    from T.AdditiveIdentity and folds with total += value, the same method
    body producing a Money total from an IEnumerable<Money> and a decimal
    total from an IEnumerable<decimal>, since decimal already implements
    INumber<decimal>.

- name: 29-irateable-static-dispatch
  section: "Ch. 29"
  title: Three static contracts, one generic quote, one generic total
  caption: >-
    ParcelShipment, FreightPallet, and DocumentEnvelope each implement
    IRateable<TSelf> with their own static Money BaseRate and static
    RateOf(shipment): 4.50m plus a per-kilogram surcharge, 35.00m plus
    weight and per-pallet charges, and 2.00m plus a per-page fee.
    RateBook.Quote<T>(shipment), constrained to where T : IRateable<T>,
    calls T.RateOf(shipment) for whichever concrete type the caller
    passes, and the resulting IEnumerable<Money> quotes feed
    Totals.Sum<T>(values), which seeds its total from
    T.AdditiveIdentity and folds with total += value until one Money
    total comes out, a single generic path from three independent
    static contracts to one aggregate.

- name: 27-source-generators
  section: "Ch. 27"
  title: One manifest, one generator, no runtime registry
  caption: >-
    carriers.manifest is an AdditionalFiles entry listing the DHLX, FDXG,
    UPSX, and USPS rows. CarrierGatewayGenerator, an IIncrementalGenerator,
    reads it at build time and emits one <Code>CarrierGateway adapter per
    row, such as DHLXCarrierGateway, plus a GeneratedCarrierRegistry
    exposing All and Find(code). That generated registry replaces a
    hand-written runtime registry that would otherwise reflect over loaded
    assemblies at process startup, so the trim- and AOT-compiled output
    never performs that scan.

- name: 27-incremental-generator-pipeline
  section: "Ch. 27"
  title: Parsing to an equatable model so unchanged input is cached
  caption: >-
    The incremental pipeline behind CarrierGatewayGenerator.
    AdditionalTextsProvider surfaces carriers.manifest, Parse(text,
    cancellationToken) turns each file into a CarrierManifestModel, a
    readonly record struct wrapping an EquatableArray<CarrierEntry>, and
    Collect().Select(Combine) merges every parsed manifest into one model
    before RegisterSourceOutput(model, Emit) runs. Because
    CarrierManifestModel compares by value through EquatableArray<T>, an
    unchanged manifest produces an unchanged model and the pipeline skips
    Emit entirely.

- name: 27-generated-registry-vs-reflection
  section: "Ch. 27"
  title: A compile-time registry needs no runtime scan
  caption: >-
    CarrierGatewayGenerator builds GeneratedCarrierRegistry from
    carriers.manifest at compile time, statically referencing each
    <Code>CarrierGateway adapter it emits, so CarrierDispatch.ResolveEndpoint
    calls GeneratedCarrierRegistry.Find(code) against references that already
    exist in source. The runtime alternative it replaces calls
    Assembly.GetTypes() to scan loaded assemblies at process startup and
    builds its lookup table from whatever the scan finds, a path that
    trimming can remove types out from under and that native AOT does not
    fully support.

- name: 28-roslyn-analyzers
  section: "Ch. 28"
  title: Flagging decimal money on a wire contract at compile time
  caption: >-
    MoneyAsDecimalAnalyzer, a DiagnosticAnalyzer reporting DiagnosticId
    SHIP0001, inspects every type carrying [WireContract] during
    compilation. RateQuoteContract and BookingChargeContract pass: both
    model money as long minor units, AmountMinorUnits and
    PriceMinorUnits. InternalRateCalculation carries no [WireContract],
    so its decimal Amount is never even examined. A [WireContract] type
    with a decimal money property is where the analyzer reports
    SHIP0001, a build-time warning surfaced at the offending property's
    location.

- name: 28-analyzer-diagnostic-pipeline
  section: "Ch. 28"
  title: From compilation start to a reported diagnostic
  caption: >-
    Initialize(context) registers RegisterCompilationStartAction, which
    resolves the marker symbol for "WireContracts.WireContractAttribute"
    through start.Compilation.GetTypeByMetadataName and returns early if
    it is missing. Once resolved, RegisterSymbolAction(ctx =>
    AnalyzeType(ctx, marker), SymbolKind.NamedType) runs for every named
    type; AnalyzeType checks type.GetAttributes().Any(...) for the
    marker, then walks the type's members for any IPropertySymbol whose
    Type.SpecialType is System_Decimal, calling
    context.ReportDiagnostic(Rule, location, property.Name, type.Name)
    on each one it finds.

- name: 30-the-options-pattern
  section: "Ch. 30"
  title: One options type, bound once, consumed three ways
  caption: >-
    CarrierGatewayOptions binds once from configuration, then reaches
    callers three ways: a long-lived singleton value, a per-request snapshot, and
    a monitor that tracks the current value across reloads.

- name: 30-options-change-notification
  section: "Ch. 30"
  title: A reload reaches the monitor and startup gates on validation
  caption: >-
    When configuration reloads, CarrierGatewayOptions rebinds and
    RetryBudgetWatcher is notified immediately. A validator wired in at
    startup fails the host before any of this runs against bad config.

- name: 30-options-validation-on-start
  section: "Ch. 30"
  title: Collecting every failure before the host ever starts
  caption: >-
    CarrierGatewayOptionsValidator collects every failure reason instead of
    stopping at the first one, then ValidateOnStart fails the host at
    startup, before any caller can use the bad configuration.

- name: 31-tester-doer-and-the-result-debate
  section: "Ch. 31"
  title: One decision, two shapes, Try-Parse beside Result
  caption: >-
    The same parse-and-validate decision appears twice: Try-Parse style
    methods report failure through a boolean, while Result wraps the
    same outcome as a value a caller cannot ignore.

- name: 31-try-parse-vs-result
  section: "Ch. 31"
  title: Branch immediately, or carry the reason and compose
  caption: >-
    A boolean and an out parameter force a caller to branch right away.
    A Result value carries its own failure reason and keeps composing
    through later steps. Neither shape wins outright.

- name: 31-result-composition
  section: "Ch. 31"
  title: Chaining through a failure reason, or branching by hand
  caption: >-
    Result's Map method chains a success through each step and
    short-circuits on the first failure, while the bool-and-out shape
    forces a caller to branch immediately after every call.

- name: 32-tap-and-async-conventions
  section: "Ch. 32"
  title: ICarrierGateway's async surface follows TAP conventions
  caption: >-
    ICarrierGateway follows the Task-based Asynchronous Pattern: every
    async member ends in Async, returns a Task or ValueTask, and accepts
    a cancellation token, so a fake implementation can stand in cleanly.

- name: 32-cancellation-and-progress
  section: "Ch. 32"
  title: Cancellation and progress inside one dispatch loop
  caption: >-
    Dispatching a batch checks for cancellation before each item and
    reports progress after it, so a caller watching the progress
    consumer sees steady updates until a cancellation stops the loop.

- name: 32-task-valuetask-shape
  section: "Ch. 32"
  title: A Task for real work, a ValueTask for the fast path
  caption: >-
    DispatchAsync returns a Task because it awaits real work, while
    IsReachableAsync returns an already-completed ValueTask on its usual
    synchronous path, avoiding an allocation for work that never went async.
